<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<meta name="theme-color" content="#C2571F">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Escala">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Escala da Equipe</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
/* Paleta da IIR Brasil: papel creme, terracota, dourado e um marrom quente
   no lugar do preto. Nada aqui é cor padrão de biblioteca — todas saem da
   identidade da igreja. */
:root{
  --bg:#F1ECE2; --card:#FFFCF6; --ink:#2A241E; --muted:#7C6F60; --line:#E3D9C9;
  --brand:#C2571F; --brand-soft:#F8EADF; --ok:#5F7138; --ok-soft:#EDF1E1;
  --warn:#A8823F; --warn-soft:#F8F0DF; --bad:#A8371F; --bad-soft:#F9E7E1;
  --safe-b:env(safe-area-inset-bottom,0px); --safe-t:env(safe-area-inset-top,0px);
  --on-brand:#FFFCF6; --hero-bg:#2A241E; --hero-fg:#F4EFE4;
  --dourado:#B08D57;
  --serif:"Fraunces",ui-serif,"New York",Georgia,"Times New Roman",serif;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#15120E;--card:#221D17;--ink:#F2EDE3;--muted:#A2968A;--line:#332B23;
  --brand:#E08A4E;--brand-soft:#3A2417;--ok:#A6B96B;--ok-soft:#232917;
  --warn:#D9B978;--warn-soft:#2E2515;--bad:#E08A72;--bad-soft:#331A13;
  --on-brand:#221D17;--hero-bg:#0F0C09;--hero-fg:#F2EDE3;
  --dourado:#C9A876}
}
html,body{margin:0;padding:0;height:100%}
body{
  font:16px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;
  background:var(--bg);color:var(--ink);overscroll-behavior-y:none;
}
/* Títulos em serifado, como as artes da igreja. No iPhone cai na New York,
   que já vem no sistema; no resto, no serifado do aparelho. Sem download,
   sem depender de rede — o app precisa abrir offline. */
h1,h2,.hero h1,.serif{font-family:var(--serif);font-weight:600;letter-spacing:-.2px}
.hero h1{font-weight:600;letter-spacing:-.4px}
/* rótulos em caixa alta espaçada, o outro traço forte da identidade */
.sec-t,.hero-badge,.fn{letter-spacing:1.1px}
#app{padding:calc(var(--safe-t) + 8px) 0 calc(76px + var(--safe-b));max-width:640px;margin:0 auto}
h1{font-size:30px;font-weight:800;letter-spacing:-.5px;margin:8px 16px 4px}
h2{font-size:18px;font-weight:700;margin:22px 16px 8px}
.sub{color:var(--muted);font-size:14px;margin:0 16px 12px}
.card{background:var(--card);border-radius:16px;margin:0 16px 12px;overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid var(--line);cursor:pointer}
.row:last-child{border-bottom:none}
.row .grow{flex:1;min-width:0}
.row .t{font-weight:600}
.row .s{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chev{color:var(--muted);font-size:20px;flex:none}
.avatar{width:38px;height:38px;border-radius:50%;background:var(--brand-soft);color:var(--brand);
  display:grid;place-items:center;font-weight:700;font-size:14px;flex:none}
.pill{display:inline-block;font-size:12px;font-weight:600;padding:3px 9px;border-radius:99px;
  background:var(--brand-soft);color:var(--brand)}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.mut{background:var(--line);color:var(--muted)}
button,.btn{font:inherit;font-weight:600;border:none;border-radius:12px;padding:13px 16px;
  background:var(--brand);color:#fff;cursor:pointer;width:100%;display:block;text-align:center}
button:active{opacity:.7}
.btn2{background:var(--card);color:var(--brand);border:1px solid var(--line)}
.btn-d{background:transparent;color:var(--bad)}
.btn-sm{width:auto;padding:8px 14px;font-size:14px;border-radius:10px}
.pad{padding:0 16px}
.gap{height:12px}
textarea{min-height:96px;resize:vertical}
input,select,textarea{font:inherit;width:100%;padding:13px 14px;border:1px solid var(--line);
  border-radius:12px;background:var(--card);color:var(--ink);margin-bottom:10px}
label{display:block;font-size:13px;font-weight:600;color:var(--muted);margin:0 0 5px 2px}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--card);
  border-top:1px solid var(--line);padding-bottom:var(--safe-b);z-index:40;
  backdrop-filter:saturate(180%) blur(20px)}
nav button{background:none;color:var(--muted);border-radius:0;padding:9px 0 7px;font-size:10px;
  font-weight:600;display:flex;flex-direction:column;align-items:center;gap:3px;flex:1}
nav button svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.9;
  stroke-linecap:round;stroke-linejoin:round}
nav button.on{color:var(--brand)}
nav button{position:relative}
nav .bdg{position:absolute;top:4px;left:50%;margin-left:5px;background:var(--bad);color:var(--on-brand);
  font-size:10px;font-weight:800;min-width:17px;height:17px;border-radius:99px;padding:0 4px;
  display:grid;place-items:center;line-height:1}
.aviso{display:flex;gap:11px;padding:13px 16px;border-bottom:1px solid var(--line);align-items:flex-start}
.aviso:last-child{border-bottom:none}
.aviso .dot{width:8px;height:8px;border-radius:50%;background:var(--brand);flex:none;margin-top:6px}
.aviso .dot.off{background:transparent}
.aviso .q{font-size:12px;color:var(--muted);margin-top:3px}
.cal .d.aus{background:repeating-linear-gradient(45deg,var(--warn),var(--warn) 4px,transparent 4px,transparent 8px);
  border-color:var(--warn);color:var(--ink);font-weight:700}
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:50;display:none}
.sheet-bg.on{display:block}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:51;background:var(--bg);
  border-radius:20px 20px 0 0;max-height:92vh;overflow-y:auto;transform:translateY(100%);
  transition:transform .25s cubic-bezier(.32,.72,0,1);padding-bottom:calc(24px + var(--safe-b));
  max-width:640px;margin:0 auto}
.sheet.on{transform:translateY(0)}
.sheet-h{display:flex;align-items:center;gap:12px;padding:14px 16px;position:sticky;top:0;
  background:var(--bg);border-bottom:1px solid var(--line);z-index:2}
.sheet-h b{flex:1;font-size:17px}
.sheet-h button{width:auto;background:none;color:var(--brand);padding:4px 2px;font-size:16px}
.sheet-b{padding:16px}
.empty{text-align:center;color:var(--muted);padding:36px 24px;font-size:15px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.chip{padding:8px 13px;border-radius:99px;border:1px solid var(--line);background:var(--card);
  font-size:14px;font-weight:600;cursor:pointer;color:var(--ink);width:auto;display:inline-block}
.chip.on{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-bottom:12px}
.cal .dow{text-align:center;font-size:11px;font-weight:700;color:var(--muted);padding:4px 0}
.cal .d{aspect-ratio:1;display:grid;place-items:center;border-radius:10px;font-size:14px;
  background:var(--card);cursor:pointer;border:1px solid var(--line)}
.cal .d.off{opacity:.25;pointer-events:none;border:none;background:none}
.cal .d.esc{background:var(--ok);color:var(--on-brand);border-color:var(--ok);font-weight:800}
.cal .d.no{background:var(--bad);color:var(--on-brand);border-color:var(--bad)}
.cal .d.ev{box-shadow:inset 0 -3px 0 var(--brand)}
/* escalado E indisponivel ao mesmo tempo: o vermelho vence, mas fica um
   contorno verde para o conflito nao passar despercebido */
.cal .d.esc.no{background:var(--bad);border:2px solid var(--ok)}
.legenda{display:flex;flex-wrap:wrap;gap:10px 14px;margin-top:10px}
.legenda span{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.legenda i{width:14px;height:14px;border-radius:5px;border:1px solid var(--line);flex:none}
.toast{position:fixed;left:50%;bottom:calc(90px + var(--safe-b));transform:translateX(-50%) translateY(12px);
  background:#111827;color:#fff;padding:11px 18px;border-radius:99px;font-size:14px;font-weight:600;
  z-index:99;opacity:0;transition:.2s;pointer-events:none;max-width:88vw}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.hdr{display:flex;align-items:center;justify-content:space-between;margin:8px 16px 4px}
.hdr h1{margin:0}
.add{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-size:22px;
  line-height:0;padding:0;flex:none}
.sec-t{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;
  letter-spacing:.6px;margin:20px 16px 7px}
.bar{height:6px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--brand)}
.warnbox{background:var(--warn-soft);color:var(--warn);font-size:13px;font-weight:600;
  padding:11px 14px;border-radius:12px;margin:0 16px 12px}
.slot{display:flex;align-items:center;gap:11px;padding:12px 16px;border-bottom:1px solid var(--line)}
.slot:last-child{border-bottom:none}
.slot .fn{font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.4px}
.slot .nm{font-weight:600}
.slot .nm.vazio{color:var(--muted);font-weight:500;font-style:italic}

/* ============================================================
   VISUAL v2 — identidade por papel + mais cor e hierarquia
   ============================================================ */
/* --on-brand = cor do texto EM CIMA da cor de destaque. No modo escuro a cor
   de destaque fica clara, entao o texto tem de escurecer, senao some. */
/* Os dois papéis se distinguem pelo cabeçalho, não por cores diferentes de
   marca: quem lidera vê o marrom escuro da identidade; quem serve vê a
   terracota. A cor de ação é a mesma para os dois. */
body[data-papel="lider"]{--brand:#C2571F;--brand-soft:#F8EADF;--brand-ink:#8A3C13;
  --on-brand:#FFFCF6;--hero-bg:#2A241E;--hero-fg:#F4EFE4}
body[data-papel="voluntario"]{--brand:#C2571F;--brand-soft:#F8EADF;--brand-ink:#8A3C13;
  --on-brand:#FFFCF6;--hero-bg:#C2571F;--hero-fg:#FFF6EC}
@media (prefers-color-scheme:dark){
  body[data-papel="lider"]{--brand:#E08A4E;--brand-soft:#3A2417;--brand-ink:#F0B98A;
    --on-brand:#221D17;--hero-bg:#0F0C09;--hero-fg:#F2EDE3}
  body[data-papel="voluntario"]{--brand:#E08A4E;--brand-soft:#3A2417;--brand-ink:#F0B98A;
    --on-brand:#221D17;--hero-bg:#7A3512;--hero-fg:#FBEEE2}
}
#app{padding-top:0}

/* --- cabecalho colorido --- */
.hero{background:var(--hero-bg);color:var(--hero-fg);padding:calc(var(--safe-t) + 16px) 20px 22px;
  border-radius:0 0 22px 22px;margin-bottom:16px}
.hero h1{color:var(--hero-fg);margin:6px 0 2px;font-size:29px;letter-spacing:-.6px}
.hero p{margin:0;font-size:14px;color:var(--hero-fg);opacity:.85;line-height:1.35}
.hero-top{display:flex;align-items:center;gap:10px;min-height:30px}
.hero-badge{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.22);
  color:var(--hero-fg);font-size:11px;font-weight:800;letter-spacing:.7px;text-transform:uppercase;
  padding:5px 11px;border-radius:99px}
.hero-sp{flex:1}
/* selo de conexao: bolinha + palavra, no alto de toda tela principal */
.conx{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.18);
  color:var(--hero-fg);font-size:11px;font-weight:800;letter-spacing:.5px;
  padding:5px 10px;border-radius:99px;margin-right:8px;cursor:pointer;white-space:nowrap}
.conx i{width:8px;height:8px;border-radius:50%;background:currentColor;flex:none}
.conx.on i{background:#4ade80}
.conx.off i{background:#fbbf24}
.conx.bad i{background:#f87171}
.conx.sync i{background:#93c5fd;animation:pisca 1.1s ease-in-out infinite}
.conx.off{background:rgba(251,191,36,.28)}
.conx.bad{background:rgba(248,113,113,.3)}
@keyframes pisca{0%,100%{opacity:1}50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){.conx.sync i{animation:none}}
.hero-org{font-size:12px;font-weight:700;opacity:.85;color:var(--hero-fg);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:40%}
.hero-org{font-size:12px;font-weight:700;opacity:.8;color:var(--hero-fg);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:38%}
.hero .add{background:rgba(255,255,255,.24);color:var(--hero-fg);width:38px;height:38px;font-size:23px}
.hero .add:active{background:rgba(255,255,255,.38)}
.hero-num{display:flex;gap:10px;margin-top:16px}
.hero-num div{flex:1;background:rgba(255,255,255,.18);border-radius:13px;padding:9px 12px}
.hero-num b{display:block;font-size:21px;line-height:1.15;color:var(--hero-fg)}
.hero-num span{font-size:11px;opacity:.88;font-weight:600;color:var(--hero-fg)}

/* --- voltar --- */
.volta{display:flex;align-items:center;gap:8px;padding:calc(var(--safe-t) + 12px) 16px 0}
.volta button{width:auto;background:none;color:var(--brand);padding:6px 0;font-size:16px;font-weight:700}

/* --- listas --- */
.card{box-shadow:0 1px 2px rgba(0,0,0,.05)}
.row{min-height:56px}
.row:active{background:var(--brand-soft)}
.chev{opacity:.5}
h2{font-size:17px}
.sec-t{font-size:11.5px}

/* --- data em destaque na lista de cultos --- */
.dchip{width:50px;flex:none;text-align:center;background:var(--brand-soft);color:var(--brand-ink);
  border-radius:12px;padding:7px 0}
.dchip b{display:block;font-size:20px;font-weight:800;line-height:1}
.dchip span{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;opacity:.75}
.dchip.hoje{background:var(--brand);color:var(--on-brand)}
.dchip.hoje span{opacity:.9}

/* --- pills mais legiveis --- */
.pill{font-size:11.5px;padding:4px 10px;font-weight:700}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}

/* --- avisos coloridos --- */
.warnbox{display:flex;align-items:center;gap:9px;border-left:4px solid var(--warn);
  border-radius:0 12px 12px 0}
.infobox{background:var(--brand-soft);color:var(--brand-ink);font-size:13px;font-weight:600;
  padding:11px 14px;margin:0 16px 12px;border-radius:0 12px 12px 0;border-left:4px solid var(--brand);
  display:flex;align-items:center;gap:9px;cursor:pointer}
.okbox{background:var(--ok-soft);color:var(--ok);font-size:13px;font-weight:600;
  padding:11px 14px;margin:0 16px 12px;border-radius:0 12px 12px 0;border-left:4px solid var(--ok)}

/* botao que e link de verdade (webcal:, Google): precisa parecer botao */
.bt-ag{display:block;text-align:center;text-decoration:none;font-weight:700;
  font-size:16px;padding:14px 16px;border-radius:14px;margin-bottom:10px;
  background:var(--brand);color:var(--on-brand)}
.bt-ag:active{opacity:.85}

/* --- botoes --- */
/* color herdada de --on-brand para nunca ficar branco sobre cor clara no escuro */
button,.btn{border-radius:13px;padding:14px 16px;color:var(--on-brand)}
.btn2{color:var(--brand)}
.btn-d{color:var(--bad)}
.btn-ok{background:var(--ok)}
.btn-warn{background:var(--warn)}
nav button{color:var(--muted)}
nav button.on{color:var(--brand)}

/* --- barra inferior --- */
nav button{padding:8px 0 6px;gap:2px}
nav .navico{width:44px;height:28px;display:grid;place-items:center;border-radius:99px;transition:.15s}
nav button.on .navico{background:var(--brand-soft)}
nav button svg{width:22px;height:22px}
nav .bdg{top:1px;margin-left:7px}

/* --- equipe com faixa de cor --- */
.teamhead{display:flex;align-items:center;gap:9px;margin:22px 16px 8px}
.teamhead .dot{width:11px;height:11px;border-radius:3px;flex:none}
.teamhead h2{margin:0;flex:1}

/* --- cartao da minha escala --- */
.mcard{border-left:5px solid var(--brand)}
.mcard.confirmado{border-left-color:var(--ok)}
.mcard.recusado{border-left-color:var(--bad)}
.mcard.pendente{border-left-color:var(--warn)}
.hbox{flex:1;background:var(--bg);border-radius:12px;padding:9px 12px}
.hbox .fn{font-size:10.5px;letter-spacing:.4px}
.hbox b{font-size:21px;font-weight:800;display:block;margin-top:1px}

/* --- estado vazio com acao --- */
.empty{padding:30px 24px}
.empty b{display:block;color:var(--ink);font-size:16px;margin-bottom:4px}

/* --- faixa "instale o app" --- */
.instalar{display:flex;align-items:center;gap:12px;background:var(--brand-soft);
  color:var(--brand-ink);margin:0 16px 14px;padding:13px 14px;border-radius:14px;
  border:1px solid var(--brand);cursor:pointer}
.instalar .ico{font-size:26px;line-height:1;flex:none}
.instalar .t{font-weight:700;font-size:15px}
.instalar .s{font-size:12.5px;opacity:.8;line-height:1.3}
.instalar .fechar{width:28px;height:28px;padding:0;flex:none;background:transparent;
  color:var(--brand-ink);opacity:.55;font-size:20px;line-height:0}
</style>
</head>
<body>
<div id="app"></div>
<nav id="nav"></nav>
<div class="sheet-bg" id="sbg" onclick="closeSheet()"></div>
<div class="sheet" id="sheet"><div class="sheet-h"><button onclick="closeSheet()">Cancelar</button><b id="sheetTitle"></b><button id="sheetOk" onclick="sheetSave()">Salvar</button></div><div class="sheet-b" id="sheetBody"></div></div>
<div class="toast" id="toast"></div>
<script>
/* ============ ARMAZENAMENTO ============ */
const KEY='escala.v1';
var MOSTRA_CODIGO=false;   // true = forcar a tela de digitar codigo
const VERSAO='1.3';
/* Todo id precisa ser um UUID de verdade: e o tipo das colunas no banco.
   Enquanto isto gerava 8 caracteres soltos, o Postgres recusava
   "invalid input syntax for type uuid" e NADA que fosse criado no app
   conseguia subir para a nuvem. */
const ehUuid=s=>typeof s==='string'&&
  /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(s);
function uid(){
  try{if(self.crypto&&crypto.randomUUID)return crypto.randomUUID();}catch(e){}
  const b=new Uint8Array(16);
  try{crypto.getRandomValues(b);}
  catch(e){for(let i=0;i<16;i++)b[i]=Math.floor(Math.random()*256);}
  b[6]=(b[6]&0x0f)|0x40; b[8]=(b[8]&0x3f)|0x80;   /* versao 4, variante RFC */
  const h=[...b].map(x=>x.toString(16).padStart(2,'0')).join('');
  return h.slice(0,8)+'-'+h.slice(8,12)+'-'+h.slice(12,16)+'-'+h.slice(16,20)+'-'+h.slice(20);
}

/* Quem ja usava o app tem ids no formato antigo guardados no aparelho.
   Trocamos todos por UUID e refazemos as referencias, senao os dados
   antigos continuariam sendo recusados para sempre. */
function migrarIds(d){
  const mapa={};
  const nv=x=>{
    if(typeof x!=='string'||!x||ehUuid(x))return x;
    if(!mapa[x])mapa[x]=uid();
    return mapa[x];
  };
  const M=(o,ks)=>ks.forEach(k=>{if(o&&o[k]!==undefined)o[k]=nv(o[k]);});
  (d.teams||[]).forEach(t=>{M(t,['id']);(t.funcoes||[]).forEach(f=>M(f,['id']));});
  (d.pessoas||[]).forEach(p=>{M(p,['id']);
    if(Array.isArray(p.funcaoIds))p.funcaoIds=p.funcaoIds.map(nv);
    if(Array.isArray(p.teamIds))p.teamIds=p.teamIds.map(nv);});
  (d.eventos||[]).forEach(e=>{M(e,['id']);
    if(Array.isArray(e.teamIds))e.teamIds=e.teamIds.map(nv);
    if(e.chegadas){const c={};Object.keys(e.chegadas).forEach(k=>c[nv(k)]=e.chegadas[k]);e.chegadas=c;}});
  (d.escalas||[]).forEach(a=>M(a,['id','eventoId','teamId','funcaoId','pessoaId']));
  (d.indisp||[]).forEach(i=>M(i,['pessoaId']));
  (d.ausencias||[]).forEach(a=>M(a,['id','pessoaId']));
  (d.trocas||[]).forEach(t=>{M(t,['id','escalaId','deId','paraId','aceitaPor']);
    if(Array.isArray(t.recusadoPor))t.recusadoPor=t.recusadoPor.map(nv);});
  (d.avisos||[]).forEach(a=>M(a,['id','paraId','ref']));

/* garante codigo de acesso para todo mundo e ao menos um lider */
function normalizar(d){
  migrarIds(d);
  const usados=new Set(d.pessoas.map(p=>p.codigo).filter(Boolean));
  ['ausencias','trocas','avisos'].forEach(k=>{if(!Array.isArray(d[k]))d[k]=[];});
  if(!d.config)d.config={};
  if(d.config.limiteBloqueio==null)d.config.limiteBloqueio=30;
  if(d.config.vapid==null)d.config.vapid='';
  if(!d.config.aviso)d.config.aviso={canal:'push',aoEscalar:true,dias:[1],hora:'10:00'};
  if(d.config.whatsapp==null)d.config.whatsapp=false;
  d.pessoas.forEach(p=>{if(p.push===undefined)p.push=null;});
  d.pessoas.forEach(p=>{
    if(!p.codigo&&!p.externa){let c;do{c=novoCodigo();}while(usados.has(c));usados.add(c);p.codigo=c;}
    if(p.email===undefined)p.email='';
    if(p.nascimento===undefined)p.nascimento='';
    if(!p.perms)p.perms=p.lider?{admin:true}:{};   // migra o antigo "lider"
    p.lider=temPainel(p);
  });
  /* So faz sentido eleger um admin quando o app e local: ai a lista e a igreja
     inteira. Na nuvem, o voluntario enxerga APENAS o proprio cadastro (regra de
     seguranca do banco) — promove-lo aqui fazia o app dele virar painel de
     administrador e tentar gravar perms=admin, o que o banco recusa. Como o
     erro derrubava a sincronizacao inteira, o cadastro dele nunca salvava e o
     app pedia os dados de novo a cada acesso. */
  if(!d.igrejaId&&d.pessoas.length&&!d.pessoas.some(p=>p.perms.admin)){
    d.pessoas[0].perms={admin:true}; d.pessoas[0].lider=true;}
  d.eventos.forEach(e=>{if(!e.chegadas)e.chegadas={};
    if(typeof e.obs!=='string')e.obs='';
    if(!Array.isArray(e.links))e.links=[];
    e.links=e.links.filter(l=>l&&l.url)
      .map(l=>({titulo:String(l.titulo||''),url:String(l.url||'')}));});
  if(d.ultimoAcesso&&!d.pessoas.some(p=>p.id===d.ultimoAcesso))d.ultimoAcesso=null;
  if(d.sessao&&!d.pessoas.some(p=>p.id===d.sessao))d.sessao=null;
  return d;
}

/* ============ UTILIDADES ============ */
const DOW=['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];
const MES=['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
const MESL=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
function iso(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function pd(s){const[a,b,c]=s.split('-').map(Number);return new Date(a,b-1,c);}
function fmt(s){const d=pd(s);return DOW[d.getDay()]+', '+d.getDate()+' '+MES[d.getMonth()];}
function fmtLong(s){const d=pd(s);return DOW[d.getDay()]+', '+d.getDate()+' de '+MESL[d.getMonth()];}
const hojeIso=()=>iso(new Date());
/* horarios */
function menosMin(hhmm,min){
  const[h,m]=(hhmm||'19:00').split(':').map(Number);
  let t=h*60+m-(min||0); t=((t%1440)+1440)%1440;
  return String(Math.floor(t/60)).padStart(2,'0')+':'+String(t%60).padStart(2,'0');
}
function difMin(inicio,chegada){
  const a=inicio.split(':').map(Number),b=chegada.split(':').map(Number);
  let d=(a[0]*60+a[1])-(b[0]*60+b[1]); if(d<0)d+=1440; return d;
}
function antecTexto(min){
  if(!min)return 'na hora';
  if(min%60===0)return min/60+'h antes';
  return min<60?min+'min antes':Math.floor(min/60)+'h'+String(min%60).padStart(2,'0')+' antes';
}
/* horario de chegada da equipe num evento (com padrao da equipe) */
function chegada(ev,tid){
  if(ev.chegadas&&ev.chegadas[tid])return ev.chegadas[tid];
  const t=team(tid);
  return menosMin(ev.hora,t?(t.antecedencia==null?30:t.antecedencia):30);
}
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ini=n=>n.trim().split(/\s+/).slice(0,2).map(w=>w[0]).join('').toUpperCase();
const team=id=>DB.teams.find(t=>t.id===id);
const pessoa=id=>DB.pessoas.find(p=>p.id===id);
const evento=id=>DB.eventos.find(e=>e.id===id);
function funcao(tid,fid){const t=team(tid);return t&&t.funcoes.find(f=>f.id===fid);}
const eu=()=>pessoa(DB.meuId);
function indisponivel(pid,data){return DB.indisp.some(i=>i.pessoaId===pid&&i.data===data);}
/* ausencia = periodo bloqueado com motivo (viagem, saude, trabalho...) */
function ausenciaEm(pid,data){return DB.ausencias.find(a=>a.pessoaId===pid&&data>=a.inicio&&data<=a.fim);}
function ausente(pid,data){return indisponivel(pid,data)||!!ausenciaEm(pid,data);}
function motivoAusencia(pid,data){
  const a=ausenciaEm(pid,data);
  return a?(a.motivo||'período bloqueado'):(indisponivel(pid,data)?'dia marcado':'');
}
const diasDoPeriodo=(i,f)=>Math.round((pd(f)-pd(i))/86400000)+1;
function diasBloqueados(pid,ano){
  ano=ano||new Date().getFullYear();
  let n=0;
  DB.ausencias.filter(a=>a.pessoaId===pid).forEach(a=>{
    const i=pd(a.inicio)<new Date(ano,0,1)?iso(new Date(ano,0,1)):a.inicio;
    const f=pd(a.fim)>new Date(ano,11,31)?iso(new Date(ano,11,31)):a.fim;
    if(i<=f)n+=diasDoPeriodo(i,f);});
  return n;
}

function futuros(){return DB.eventos.filter(e=>e.data>=hojeIso()).sort((a,b)=>a.data.localeCompare(b.data)||a.hora.localeCompare(b.hora));}
function passados(){return DB.eventos.filter(e=>e.data<hojeIso()).sort((a,b)=>b.data.localeCompare(a.data));}

  clearTimeout(t._x);t._x=setTimeout(()=>t.classList.remove('on'),2200);}

/* ============ REGRAS DE ESCALA ============ */
function slotsDoEvento(ev){
  const out=[];
  ev.teamIds.forEach(tid=>{const t=team(tid); if(!t)return;
    t.funcoes.forEach(f=>{for(let i=0;i<(f.qtd||1);i++)out.push({teamId:tid,funcaoId:f.id,idx:i});});});
  return out;
}
function escalaDe(ev,tid,fid,idx){
  return DB.escalas.find(a=>a.eventoId===ev.id&&a.teamId===tid&&a.funcaoId===fid&&a.idx===idx);
}
/* Recusar nao e servir. Enquanto a linha continua na escala esperando um
   substituto, ela nao pode empurrar a pessoa para o fim da fila. */
const serviu=a=>a.status!=='recusado';
function carga(pid){return DB.escalas.filter(a=>a.pessoaId===pid&&serviu(a)).length;}

/* O rodizio olha uma janela movel, nao a vida inteira. Com o total de sempre,
   quem serviu muito ha dois anos carregava aquilo para sempre e quem entrava
   agora era escalado em tudo ate "alcancar" os outros. A janela vai de 90 dias
   atras ate o futuro: conta o passado recente e tambem o que ja foi marcado
   para os proximos cultos. */
const JANELA_RODIZIO=90;
function inicioJanela(){
  const d=new Date(); d.setDate(d.getDate()-JANELA_RODIZIO); return iso(d);
}
/* ---- ciclo mensal ----------------------------------------------------
   A regra da casa e simples de explicar para a equipe: dentro do mes, todo
   mundo pega o mesmo tanto. A conta zera na virada do mes, entao quem serviu
   muito em marco comeca abril em igualdade com quem serviu pouco.
   A janela de 90 dias continua existindo, mas rebaixada a desempate: entre
   duas pessoas com o mesmo tanto no mes, vai a que serviu menos no trimestre.
   Sem esse desempate, o primeiro culto de cada mes seria sorteio por nome. */
const cicloDe=data=>String(data||'').slice(0,7);
/* Com a nuvem ligada o aparelho guarda a janela de 12 meses, entao chamar
   aquilo de "total" seria mentira — e a pessoa acharia que perdeu historico. */
const rotuloTotal=()=>(typeof naNuvem==='function'&&naNuvem())?'nos últimos 12 meses':'no total';
const cicloAtual=()=>cicloDe(hojeIso());
function nomeDoCiclo(ciclo){
  const m=+String(ciclo||'').slice(5,7);
  return (MESL[m-1]||'')+' de '+String(ciclo||'').slice(0,4);
}
function cargaCiclo(pid,ciclo){
  ciclo=ciclo||cicloAtual();
  return DB.escalas.filter(a=>{
    if(a.pessoaId!==pid||!serviu(a))return false;
    const e=evento(a.eventoId); return !!e&&cicloDe(e.data)===ciclo;
  }).length;
}
function cargaJanela(pid,corte){
  corte=corte||inicioJanela();
  return DB.escalas.filter(a=>{
    if(a.pessoaId!==pid||!serviu(a))return false;
    const e=evento(a.eventoId); return !!e&&e.data>=corte;
  }).length;
}
function ultimaVez(pid){
  let ult='0000-00-00';
  DB.escalas.forEach(a=>{
    if(a.pessoaId!==pid||!serviu(a))return;
    const e=evento(a.eventoId);
    if(e&&e.data>ult)ult=e.data;
  });
  return ult;
}
/* Uma passada so pelas escalas, em vez de uma varredura por pessoa. Com dois
   anos de historico a diferenca e de centenas de milissegundos numa tela que
   a pessoa espera abrir na hora. */
function mapaCarga(corte,ciclo){
  const total={},janela={},ultima={},mes={};
  DB.pessoas.forEach(p=>{total[p.id]=0;janela[p.id]=0;mes[p.id]=0;ultima[p.id]='0000-00-00';});
  DB.escalas.forEach(a=>{
    if(!serviu(a)||total[a.pessoaId]===undefined)return;
    total[a.pessoaId]++;
    const e=evento(a.eventoId); if(!e)return;
    if(e.data>ultima[a.pessoaId])ultima[a.pessoaId]=e.data;
    if(!corte||e.data>=corte)janela[a.pessoaId]++;
    if(ciclo&&cicloDe(e.data)===ciclo)mes[a.pessoaId]++;
  });
  return{total,janela,ultima,mes};
}
function candidatos(ev,tid,fid){
  return DB.pessoas.filter(p=>p.teamIds.includes(tid)&&p.funcaoIds.includes(fid)&&!ausente(p.id,ev.data));
}
/* Emparelhamento maximo (algoritmo de Kuhn) para nao "desperdicar" especialistas:
   quem so toca teclado nao e gasto numa vaga de vocal. A ordem de preferencia
   dentro de cada vaga e por menor carga, garantindo o rodizio. */
function gerarEscala(ev,sobrescrever){
  if(sobrescrever)DB.escalas=DB.escalas.filter(a=>a.eventoId!==ev.id);
  const ocupados=new Set(DB.escalas.filter(a=>a.eventoId===ev.id).map(a=>a.pessoaId));
  const abertos=slotsDoEvento(ev).filter(s=>!escalaDe(ev,s.teamId,s.funcaoId,s.idx));
  /* tudo calculado de uma vez: antes, cada comparacao do sort varria a lista
     inteira de escalas para descobrir a ultima vez que a pessoa serviu */
  /* o ciclo e o do MES DO CULTO, nao o de hoje: montar em setembro a escala
     de outubro tem de usar a conta de outubro, senao o mes que vem ja nasce
     desequilibrado */
  const ciclo=cicloDe(ev.data);
  const m=mapaCarga(inicioJanela(),ciclo);
  const adj=abertos.map(s=>candidatos(ev,s.teamId,s.funcaoId)
    .filter(p=>!ocupados.has(p.id))
    .sort((a,b)=>m.mes[a.id]-m.mes[b.id]
      ||m.janela[a.id]-m.janela[b.id]
      ||m.ultima[a.id].localeCompare(m.ultima[b.id])||a.nome.localeCompare(b.nome))
    .map(p=>p.id));
  const par={}; // pessoaId -> indice da vaga
  function tenta(i,vis){
    for(const pid of adj[i]){
      if(vis.has(pid))continue; vis.add(pid);
      if(par[pid]===undefined||tenta(par[pid],vis)){par[pid]=i;return true;}
    }
    return false;
  }
  let n=0;
  abertos.map((s,i)=>i).sort((a,b)=>adj[a].length-adj[b].length)
    .forEach(i=>{if(tenta(i,new Set()))n++;});
  Object.keys(par).forEach(pid=>{const s=abertos[par[pid]];
    DB.escalas.push({id:uid(),eventoId:ev.id,teamId:s.teamId,funcaoId:s.funcaoId,idx:s.idx,
      pessoaId:pid,status:'pendente'});});
  const faltas=abertos.length-n;
  save();
  toast(n+' escalado(s)'+(faltas?' · '+faltas+' vaga(s) sem ninguém disponível':''));
}
function definir(ev,tid,fid,idx,pid){
  const a=escalaDe(ev,tid,fid,idx);
  if(!pid){if(a)DB.escalas=DB.escalas.filter(x=>x!==a);}
  else if(a){a.pessoaId=pid;a.status='pendente';}
  else DB.escalas.push({id:uid(),eventoId:ev.id,teamId:tid,funcaoId:fid,idx,pessoaId:pid,status:'pendente'});
  save();
}
function statusEvento(ev){
  const total=slotsDoEvento(ev).length;
  const chk=DB.escalas.filter(a=>a.eventoId===ev.id);
  return{total,preenchidos:chk.length,confirmados:chk.filter(a=>a.status==='confirmado').length,
    recusados:chk.filter(a=>a.status==='recusado').length};
}
function textoWhats(ev){
  let s='*'+ev.titulo+'*\n'+fmtLong(ev.data)+'\nInicio do culto: '+ev.hora+'\n';
  ev.teamIds.forEach(tid=>{const t=team(tid);if(!t)return;
    s+='\n*'+t.nome+'* (chegar '+chegada(ev,tid)+')\n';
    t.funcoes.forEach(f=>{for(let i=0;i<(f.qtd||1);i++){const a=escalaDe(ev,tid,f.id,i);
      s+='- '+f.nome+': '+(a?pessoa(a.pessoaId).nome:'(vago)')+'\n';}});});
  if(ev.obs&&ev.obs.trim())s+='\n*Informacoes*\n'+ev.obs.trim()+'\n';
  (ev.links||[]).forEach(l=>{if(l&&l.url)s+=(l.titulo?l.titulo+': ':'')+l.url+'\n';});
  return s;
}

}

   dizer "o que voce esta vendo e o que a equipe esta vendo". */
function seloConexao(){
  if(!nuvemCfg())return '';

/* ============ ABA: ESCALAS ============ */
function vEscalas(){
  const f=futuros();
  const vagas=f.reduce((n,e)=>{const s=statusEvento(e);return n+(s.total-s.preenchidos);},0);
  const conf=f.reduce((n,e)=>n+statusEvento(e).confirmados,0);
  const tr=trocasAbertas();
  let h=hero('Escalas','Cultos e eventos da sua igreja',
    euPosso('eventos')?'<button class="add" onclick="novoEvento()">+</button>':'',
    f.length?numeros([[f.length,'próximos cultos'],[vagas,'vagas abertas'],[conf,'confirmados']]):'');
  h+=bannerConexao()+bannerNuvem()+bannerInstalar();
  if(tr.length&&euPosso('trocas'))h+='<div class="infobox" onclick="tab(\'trocas\')">&#8644; '
    +tr.length+' pedido(s) de troca em aberto <span style="flex:1"></span>&rsaquo;</div>';
  if(vagas&&euPosso('escalas'))h+='<div class="warnbox">&#9888; '+vagas
    +' vaga(s) sem ninguém. Abra o culto e toque em Escalar automático.</div>';
  /* Quem bloqueou a data DEPOIS de ser escalado continua na escala e ninguem
     percebe ate o dia do culto. O aviso na hora do bloqueio e facil de perder;
     este fica na tela ate o problema ser resolvido. */
  /* o que e para esta semana vem antes do resto: e o que ainda da para resolver */
  const urgentes=eventosComBuraco();
  if(urgentes.length){
    h+='<div class="warnbox" style="display:block;background:var(--bad-soft);color:var(--bad)">'
     +'<b>'+ico("relogio",16)+' Faltando gente nos próximos '+DIAS_ALERTA_BURACO+' dias</b>';
    urgentes.forEach(ev=>{const s=statusEvento(ev), q=diasAte(ev.data);
      h+='<div style="font-weight:500;margin-top:5px;cursor:pointer" onclick="go(\'evento\',\''+ev.id+'\')">'
       +'&bull; <b>'+esc(ev.titulo)+'</b> &middot; '+fmt(ev.data)+' &middot; '
       +(s.total-s.preenchidos)+' vaga(s) &middot; '
       +(q===0?'é hoje':q===1?'é amanhã':'em '+q+' dias')+' &rsaquo;</div>';});
    h+='</div>';
  }
  const cfl=conflitosEscala();
  if(cfl.length)h+='<div class="warnbox" style="display:block;cursor:pointer" onclick="verConflitos()">'
   +'<b>'+ico("alerta",16)+' '+cfl.length+' pessoa(s) escaladas em dia que bloquearam</b>'
   +'<div style="font-weight:600;margin-top:4px;opacity:.85">Toque para ver e trocar. &rsaquo;</div></div>';
  if(!f.length){
    if(euPosso('eventos')&&(!DB.teams.length||!DB.pessoas.filter(x=>x.funcaoIds.length).length))
      h+=roteiroInicial();
    else h+='<div class="empty"><b>Nenhum culto marcado</b>'
      +(euPosso('eventos')?'Toque no + ali em cima para criar o primeiro.':'Fale com o líder.')+'</div>';
  }
  else{h+='<div class="card">';
    f.forEach(ev=>{const s=statusEvento(ev), d=pd(ev.data);
      const cor=s.preenchidos<s.total?'warn':(s.confirmados===s.total?'ok':'mut');
      const txt=s.preenchidos<s.total?(s.total-s.preenchidos)+' vaga(s)':s.confirmados+'/'+s.total+' confirmados';
      h+='<div class="row" onclick="go(\'evento\',\''+ev.id+'\')">'
        +'<div class="dchip'+(ev.data===hojeIso()?' hoje':'')+'"><b>'+d.getDate()+'</b><span>'+MES[d.getMonth()]+'</span></div>'
        +'<div class="grow"><div class="t">'+esc(ev.titulo)+'</div>'
        +'<div class="s">'+DOW[d.getDay()]+' &middot; culto às '+esc(ev.hora)
        +(temInfo(ev)?' &middot; '+ico('info',13)+' info':'')+'</div></div>'
        +'<span class="pill '+cor+'">'+txt+'</span><span class="chev">&#8250;</span></div>';});
    h+='</div>';}
  const p=passados().slice(0,5);
  if(p.length){h+='<div class="sec-t">Anteriores</div><div class="card">';
    p.forEach(ev=>{const d=pd(ev.data);
      h+='<div class="row" onclick="go(\'evento\',\''+ev.id+'\')">'
      +'<div class="dchip" style="opacity:.5"><b>'+d.getDate()+'</b><span>'+MES[d.getMonth()]+'</span></div>'
      +'<div class="grow"><div class="t" style="opacity:.6">'+esc(ev.titulo)+'</div>'
      +'<div class="s">'+fmt(ev.data)+'</div></div>'
      +'<span class="chev">&#8250;</span></div>';});
    h+='</div>';}
  return h;
}

function vEvento(id){
  const ev=evento(id); if(!ev)return '<div class="empty">Evento não encontrado</div>';
  const s=statusEvento(ev);
  let h=voltarBar(ev.titulo);
  h+='<p class="sub">'+fmtLong(ev.data)+' &middot; culto às '+esc(ev.hora)+'</p>';
  h+='<div class="pad"><div class="card" style="margin:0 0 12px;padding:14px 16px">'
    +'<div style="display:flex;justify-content:space-between;font-size:14px;font-weight:700">'
    +'<span>'+s.preenchidos+' de '+s.total+' posições</span>'
    +'<span style="color:var(--ok)">'+s.confirmados+' confirmados</span></div>'
    +'<div class="bar" style="height:9px"><i style="width:'+(s.total?Math.round(s.preenchidos/s.total*100):0)+'%;'
    +(s.preenchidos<s.total?'background:var(--warn)':'background:var(--ok)')+'"></i></div>'
    +(s.recusados?'<div style="color:var(--bad);font-size:13px;font-weight:600;margin-top:8px">'
      +s.recusados+' pessoa(s) precisam trocar esta data</div>':'')

  h+=cartaoInfoCulto(ev);
  /* quem serve neste culto tem um atalho para resolver a propria vaga aqui
     mesmo, sem ter de voltar e procurar na lista */
  const minhaAqui=DB.escalas.find(a=>a.eventoId===ev.id&&a.pessoaId===DB.sessao);
  if(minhaAqui&&ev.data>=hojeIso()){
    const jaPediu=trocaDaEscala(minhaAqui.id);
    h+='<div class="pad" style="margin-bottom:6px">'
     +(jaPediu
       ?'<button class="btn2 btn-sm" style="width:100%;color:var(--warn);border-color:var(--warn)" '

    +(euPosso('escalas')?'<button class="btn-sm" style="flex:1" onclick="autoEscalar(\''+ev.id+'\')">Escalar automático</button>':'')
    +'<button class="btn2 btn-sm" style="flex:1" onclick="compartilhar(\''+ev.id+'\')">Compartilhar</button></div>'

       abrir para descobrir se vale a pena cobrar */

      +'<button class="btn2 btn-sm" style="width:100%'
      +((s.preenchidos-s.confirmados)>0?';color:var(--warn);border-color:var(--warn)':'')
      +'" onclick="cobrarEvento(\''+ev.id+'\')">'
      +((s.preenchidos-s.confirmados)>0
        ?'Notificar quem não confirmou ('+(s.preenchidos-s.confirmados)+')'
        :'Notificar a equipe deste culto')
      +'</button></div>':'')
    +((euPosso('escalas')&&usaWhats())?'<div class="pad" style="margin-bottom:6px">'
      +'<button class="btn2 btn-sm" style="width:100%" onclick="avisarEvento(\''+ev.id+'\',\'convocacao\')">'
      +'Avisar no WhatsApp quem foi escalado</button></div>':'');
  const verContato=vejoContatos(ev);
  ev.teamIds.forEach(tid=>{const t=team(tid); if(!t)return;
    const ch=chegada(ev,tid);
    h+='<div class="teamhead"><span class="dot" style="background:'+t.cor+'"></span>'

     +' &middot; '+antecTexto(difMin(ev.hora,ch))+'</span></div>'
     +'<div class="card" style="border-left:4px solid '+t.cor+'">';
    t.funcoes.forEach(f=>{for(let i=0;i<(f.qtd||1);i++){

      const st=a?(a.status==='confirmado'?'<span class="pill ok">Confirmado</span>':
        a.status==='recusado'?'<span class="pill bad">Precisa trocar</span>':'<span class="pill mut">Aguardando</span>'):

      h+='<div class="slot"'+(euPosso('escalas')?' onclick="escolher(\''+ev.id+'\',\''+tid+'\',\''+f.id+'\','+i+')" style="cursor:pointer"':'')+'>'

  return h;
}
/* ---- INFORMACOES DO CULTO ----------------------------------------------
   Um lugar so para o que a equipe precisa saber antes de chegar: o recado do
   lider e os links (ordem do culto, arquivo de midia, planilha). Quem abre o
   culto ve; quem cuida dos eventos edita. Antes isso vivia no grupo do
   WhatsApp e sumia na conversa. */
const temInfo=ev=>!!(ev&&((ev.obs&&ev.obs.trim())||(ev.links&&ev.links.length)));
const urlOk=u=>/^https?:\/\//i.test(String(u||'').trim());
const linkTitulo=l=>(l.titulo&&l.titulo.trim())
  ||String(l.url).replace(/^https?:\/\/(www\.)?/i,'').split('/')[0];
function cartaoInfoCulto(ev){
  const podeEditar=euPosso('eventos');

  let h='<div class="sec-t">Informações do culto'
   +(podeEditar?'<span style="float:right;text-transform:none;letter-spacing:0">'
     +'<a href="#" onclick="editarInfoCulto(\''+ev.id+'\');return false" '
     +'style="color:var(--brand);text-decoration:none;font-weight:700">'
     +(temInfo(ev)?'Editar':'+ Adicionar')+'</a></span>':'')
   +'</div><div class="card">';
  if(!temInfo(ev))h+='<div class="empty">Nada por aqui ainda.<br>'
   +'Recados e links que a equipe precisa ver antes do culto.</div>';
  else{
    if(ev.obs&&ev.obs.trim())h+='<div class="row" style="cursor:default;align-items:flex-start">'
     +'<span style="color:var(--brand);padding-top:2px">'+ico('info',18)+'</span>'
     +'<div class="grow" style="white-space:pre-wrap;line-height:1.55;font-size:15px">'
     +esc(ev.obs.trim())+'</div></div>';

      if(!l||!urlOk(l.url))return;
      h+='<a class="row" href="'+esc(l.url)+'" target="_blank" rel="noopener noreferrer" '
       +'style="text-decoration:none;color:inherit">'
       +'<div class="grow"><div class="t">'+esc(linkTitulo(l))+'</div>'
       +'<div class="s" style="white-space:normal;word-break:break-all">'+esc(l.url)+'</div></div>'
       +'<span class="chev">&#8250;</span></a>';});

function linhaLinkHtml(l){
  return '<div class="lkline" style="display:flex;gap:8px;margin-bottom:8px">'
   +'<input class="lkTit" placeholder="Nome" value="'+esc((l&&l.titulo)||'')+'" style="margin:0;flex:1">'
   +'<input class="lkUrl" placeholder="https://..." value="'+esc((l&&l.url)||'')+'" style="margin:0;flex:1.5">'
   +'</div>';
}
function addLinhaLink(){
  const c=document.getElementById('inLinks');
  if(c)c.insertAdjacentHTML('beforeend',linhaLinkHtml(null));
}
function lerLinks(){
  const out=[];
  document.querySelectorAll('#inLinks .lkline').forEach(l=>{
    const u=(l.querySelector('.lkUrl').value||'').trim();
    if(!u)return;
    out.push({titulo:(l.querySelector('.lkTit').value||'').trim(),
      url:urlOk(u)?u:'https://'+u.replace(/^\/+/,'')});
  });
  return out;
}
/* O recado so serve se a pessoa souber que ele existe. O aviso entra na mesma
   fila dos outros: vira notificacao no celular e fica em Avisos. */
function avisarInfoCulto(ev){
  const lista=DB.escalas.filter(a=>a.eventoId===ev.id);
  lista.forEach(a=>avisar(a.pessoaId,
    'Informações do culto atualizadas: '+ev.titulo+' ('+fmtLong(ev.data)+'). '
    +'Abra o culto no app para ver.','info',ev.id));
  if(lista.length)toast(lista.length+' aviso(s) na fila');

function editarInfoCulto(evId){
  if(!exige('eventos'))return;
  const ev=evento(evId); if(!ev)return;
  const linhas=(ev.links&&ev.links.length)?ev.links:[null];
  const escalados=DB.escalas.filter(a=>a.eventoId===ev.id).length;
  let h='<label>Recado para a equipe</label>'
   +'<textarea id="inObs" rows="6" placeholder="Ex.: entrada pelo estacionamento; '
   +'ensaio 30min antes; ceia neste domingo.">'+esc(ev.obs||'')+'</textarea>'
   +'<label style="margin-top:14px">Links</label><div id="inLinks">'
   +linhas.map(linhaLinkHtml).join('')+'</div>'
   +'<button class="btn2 btn-sm" style="width:auto" onclick="addLinhaLink()">+ Adicionar link</button>';
  if(escalados)h+='<label style="margin-top:16px;display:flex;align-items:center;gap:9px;'
   +'font-weight:600;text-transform:none;letter-spacing:0;font-size:15px">'
   +'<input type="checkbox" id="inAvisar" style="width:auto;margin:0"> '
   +'Avisar os '+escalados+' escalados</label>';
  h+='<p style="font-size:13px;color:var(--muted);margin:10px 0 0">Todo mundo que abrir este '
   +'culto vê estas informações.</p>';
  openSheet('Informações do culto',h,()=>{
    const antes=JSON.stringify([ev.obs||'',ev.links||[]]);
    ev.obs=val('inObs');
    ev.links=lerLinks();

    const av=document.getElementById('inAvisar');
    if(av&&av.checked&&mudou&&temInfo(ev))avisarInfoCulto(ev);

}

/* --- escolher pessoa para uma posicao --- */
function escolher(evId,tid,fid,idx){
  if(!exige('escalas'))return;
  const ev=evento(evId),f=funcao(tid,fid),atual=escalaDe(ev,tid,fid,idx);
  const usados=DB.escalas.filter(a=>a.eventoId===ev.id&&a!==atual).map(a=>a.pessoaId);
  const ciclo=cicloDe(ev.data);
  const mc=mapaCarga(inicioJanela(),ciclo);
  const aptos=DB.pessoas.filter(p=>p.teamIds.includes(tid)&&p.funcaoIds.includes(fid))
    .sort((a,b)=>mc.mes[a.id]-mc.mes[b.id]||mc.janela[a.id]-mc.janela[b.id]
      ||a.nome.localeCompare(b.nome));
  let h='<p class="sub" style="margin:0 0 12px">'+esc(f.nome)+' &middot; '+fmt(ev.data)+'</p>';
  if(atual){const p=pessoa(atual.pessoaId);
    h+='<div class="card" style="margin:0 0 14px"><div class="slot"><div class="avatar">'+esc(ini(p.nome))+'</div>'
      +'<div class="grow"><div class="fn">Escalado</div><div class="nm">'+esc(p.nome)+'</div></div></div></div>'
      +'<div style="display:flex;gap:8px;margin-bottom:14px">'
      +'<button class="btn-sm" style="flex:1;background:var(--ok)" onclick="marcar(\''+atual.id+'\',\'confirmado\')">Confirmar</button>'
      +'<button class="btn2 btn-sm" style="flex:1" onclick="closeSheet();pedirTrocaUI(\''+atual.id+'\')">Abrir troca</button>'
      +'<button class="btn2 btn-sm" onclick="definirUI(\''+evId+'\',\''+tid+'\',\''+fid+'\','+idx+',\'\')">Remover</button></div>';}
  h+='<div class="sec-t" style="margin:0 0 7px">Disponíveis</div><div class="card" style="margin:0">';
  let n=0;
  aptos.forEach(p=>{
    const ind=ausente(p.id,ev.data), dup=usados.includes(p.id);
    if(atual&&p.id===atual.pessoaId)return;
    n++;
    const noMes=mc.mes[p.id]||0;
    const tag=ind?'<span class="pill bad">'+esc(motivoAusencia(p.id,ev.data)||'Indisponivel')+'</span>':dup?'<span class="pill warn">Já escalado</span>'
      :'<span class="pill '+(noMes?'mut':'ok')+'">'+noMes+'x no mês</span>';
    h+='<div class="row" onclick="definirUI(\''+evId+'\',\''+tid+'\',\''+fid+'\','+idx+',\''+p.id+'\')">'
      +'<div class="avatar" style="'+(ind?'opacity:.4':'')+'">'+esc(ini(p.nome))+'</div>'
      +'<div class="grow"><div class="t" style="'+(ind?'opacity:.5':'')+'">'+esc(p.nome)+'</div></div>'+tag+'</div>';});
  if(!n)h+='<div class="empty">Ninguém cadastrado nesta função.<br>Adicione em Pessoas.</div>';
  h+='</div>';
  openSheet('Escalar',h,null);
}
function definirUI(evId,tid,fid,idx,pid){
  const ev=evento(evId);
  if(pid&&ausente(pid,ev.data)&&!confirm(pessoa(pid).nome+' está indisponível ('+motivoAusencia(pid,ev.data)+'). Escalar mesmo assim?'))return;
  definir(ev,tid,fid,idx,pid||null);closeSheet();render();
}
function marcar(aid,st){const a=DB.escalas.find(x=>x.id===aid);if(a){a.status=st;save();}closeSheet();render();}

/* ---- contato de quem serve -------------------------------------------
   Domingo 18h55 e o vocal nao chegou: quem esta no culto precisa do telefone
   na mao, nao de uma busca em Pessoas. Veem o contato a lideranca e quem
   esta escalado no MESMO culto — que sao as pessoas que precisam combinar
   atraso e substituicao no dia. Para os demais, a tela segue como era. */
function vejoContatos(ev){
  if(!ev)return false;
  if(euPosso('escalas')||euPosso('pessoas')||euPosso('trocas'))return true;
  return DB.escalas.some(a=>a.eventoId===ev.id&&a.pessoaId===DB.sessao);
}
function falarComEscalado(escalaId){
  const a=escalaPorId(escalaId); if(!a)return;
  const p=pessoa(a.pessoaId), ev=evento(a.eventoId); if(!p||!ev)return;
  const num=telE164(p.telefone);
  if(!num)return toast(p.nome.split(' ')[0]+' está sem telefone cadastrado');
  const f=funcao(a.teamId,a.funcaoId);
  const txt='Oi, '+p.nome.split(' ')[0]+'! Sobre o '+ev.titulo+' de '+fmt(ev.data)+': '
   +'você está em '+(f?f.nome:'')+' e a chegada é às '+chegada(ev,a.teamId)+'. Tudo certo?';
  abrirWhatsUrl(num,txt);
}

  DB.teams.forEach(t=>{
    const on=!ev||ev.teamIds.includes(t.id);
    const hr=ev&&ev.teamIds.includes(t.id)?chegada(ev,t.id)
      :menosMin(ev?ev.hora:'19:00',t.antecedencia==null?30:t.antecedencia);

function toggleEquipe(b){
  b.classList.toggle('on');
  const inp=b.parentNode.querySelector('.thora'), on=b.classList.contains('on');
  inp.disabled=!on; inp.style.opacity=on?'1':'.35';
  if(on&&!inp.dataset.manual){const t=team(b.parentNode.dataset.id);
    inp.value=menosMin(val('fHora')||'19:00',t.antecedencia==null?30:t.antecedencia);}
}
function recalcChegadas(){
  const hora=val('fHora')||'19:00';
  document.querySelectorAll('#fTeams .tline').forEach(l=>{
    const inp=l.querySelector('.thora');
    if(inp.dataset.manual)return;
    const t=team(l.dataset.id);
    inp.value=menosMin(hora,t.antecedencia==null?30:t.antecedencia);});
}
function lerEquipesEvento(){
  const teamIds=[],chegadas={};
  document.querySelectorAll('#fTeams .tline').forEach(l=>{
    if(!l.querySelector('.chip').classList.contains('on'))return;
    teamIds.push(l.dataset.id);
    chegadas[l.dataset.id]=l.querySelector('.thora').value||'';});
  return{teamIds,chegadas};
}
const chipsSel=id=>[...document.querySelectorAll('#'+id+' .chip.on')].map(c=>c.dataset.id);
function novoEvento(){
  if(!exige('eventos'))return;

  openSheet('Novo evento',formEvento(null),()=>{

      hora:val('fHora')||'19:00',teamIds,chegadas});

function editarEvento(id){if(!exige('eventos'))return;const ev=evento(id);
  openSheet('Editar evento',formEvento(ev),()=>{
    ev.titulo=val('fTit')||ev.titulo;ev.data=val('fData');ev.hora=val('fHora');
    const{teamIds,chegadas}=lerEquipesEvento();ev.teamIds=teamIds;ev.chegadas=chegadas;save();});

/* primeiro dia da semana pedido que cai NA data escolhida ou depois dela */
function primeiroDiaDaSemana(baseIso,dow){
  const d=pd(baseIso&&/^\d{4}-\d{2}-\d{2}$/.test(baseIso)?baseIso:hojeIso());
  d.setDate(d.getDate()+((dow-d.getDay()+7)%7));
  return d;
}
/* as datas que a recorrencia vai criar, sem as que ja existem com o mesmo
   titulo e horario: repetir "Criar vários cultos" sem querer era a forma
   mais facil de duplicar o mes inteiro */
function datasRecorrentes(baseIso,dow,qtd,titulo,hora){
  const inicio=primeiroDiaDaSemana(baseIso,dow), novas=[], repetidas=[];
  for(let i=0;i<qtd;i++){
    const x=new Date(inicio); x.setDate(x.getDate()+i*7);
    const data=iso(x);
    const ja=DB.eventos.some(e=>e.data===data&&e.hora===hora&&e.titulo===titulo);
    (ja?repetidas:novas).push(data);
  }
  return{novas,repetidas};
}
function previaRecorrentes(){
  const alvo=document.getElementById('rPrev'); if(!alvo)return;
  const dow=+val('rDow')||0, qtd=Math.min(52,Math.max(1,+val('rQtd')||8));
  const r=datasRecorrentes(val('rIni'),dow,qtd,val('rTit')||'Culto',val('rHora')||'19:00');
  const todas=r.novas.concat(r.repetidas).sort();
  alvo.innerHTML='<b>'+r.novas.length+' culto(s)</b> de '+fmtLong(todas[0])
   +' a '+fmtLong(todas[todas.length-1])
   +(r.repetidas.length?'<br><span style="color:var(--warn);font-weight:600">'
     +r.repetidas.length+' data(s) já têm esse culto e serão puladas</span>':'');
}
function eventosRecorrentes(){
  if(!exige('eventos'))return;
  let h='<label>Título</label><input id="rTit" value="Culto de Domingo" oninput="previaRecorrentes()">'
  +'<label>Dia da semana</label><select id="rDow" onchange="previaRecorrentes()">'
  +DOW.map((d,i)=>'<option value="'+i+'"'+(i===0?' selected':'')+'>'+d+'</option>').join('')+'</select>'
  +'<label>A partir de</label>'
  +'<input id="rIni" type="date" value="'+hojeIso()+'" oninput="previaRecorrentes()">'
  +'<p style="font-size:13px;color:var(--muted);margin:-4px 0 14px">O primeiro culto cai no '
  +'dia da semana escolhido, nesta data ou na primeira vez que ele acontecer depois dela.</p>'
  +'<label>Horário</label><input id="rHora" type="time" value="19:00" oninput="previaRecorrentes()">'
  +'<label>Quantas semanas</label>'
  +'<input id="rQtd" type="number" value="8" min="1" max="52" oninput="previaRecorrentes()">'
  +'<div class="card" style="margin:0 0 14px;padding:13px 16px">'
  +'<div class="fn">Vai criar</div><div id="rPrev" style="font-size:15px;margin-top:3px"></div></div>'
  +'<label>Equipes</label><div class="chips" id="rTeams">'
  +DB.teams.map(t=>'<button class="chip on" data-id="'+t.id+'" onclick="this.classList.toggle(\'on\')">'+esc(t.nome)+'</button>').join('')+'</div>';
  openSheet('Criar vários cultos',h,()=>{
    const dow=+val('rDow'),qtd=Math.min(52,Math.max(1,+val('rQtd')||8)),ts=chipsSel('rTeams');
    const hora=val('rHora')||'19:00', titulo=val('rTit')||'Culto';
    const ch={}; ts.forEach(tid=>{const t=team(tid);
      ch[tid]=menosMin(hora,t.antecedencia==null?30:t.antecedencia);});
    const r=datasRecorrentes(val('rIni'),dow,qtd,titulo,hora);
    if(!r.novas.length){toast('Esses cultos já existem');return false;}
    r.novas.forEach(data=>{
      DB.eventos.push({id:uid(),titulo,data,hora,teamIds:ts,chegadas:{...ch},obs:'',links:[]});});
    save();
    toast(r.novas.length+' culto(s) criado(s)'
      +(r.repetidas.length?' · '+r.repetidas.length+' já existia(m)':''));});
  setTimeout(previaRecorrentes,60);
}

let CALM=0;
function calendario(pid){
  const base=new Date(); base.setDate(1); base.setMonth(base.getMonth()+CALM);
  const y=base.getFullYear(),m=base.getMonth();
  const dias=new Date(y,m+1,0).getDate(), pre=new Date(y,m,1).getDay();
  const evDatas=new Set(DB.eventos.map(e=>e.data));
  /* dias em que a pessoa esta escalada: data -> texto do que ela faz */
  const escDias={};
  DB.escalas.filter(a=>a.pessoaId===pid).forEach(a=>{
    const e=evento(a.eventoId); if(!e)return;
    const f=funcao(a.teamId,a.funcaoId);
    (escDias[e.data]=escDias[e.data]||[]).push(e.titulo+(f?' — '+f.nome:''));
  });
  let h='<div class="card" style="margin:0;padding:14px">'
   +'<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px">'
   +'<button class="btn2 btn-sm" onclick="CALM--;render()">&#8249;</button>'
   +'<b>'+MESL[m]+' '+y+'</b>'
   +'<button class="btn2 btn-sm" onclick="CALM++;render()">&#8250;</button></div><div class="cal">'
   +DOW.map(d=>'<div class="dow">'+d[0]+'</div>').join('');
  for(let i=0;i<pre;i++)h+='<div class="d off"></div>';
  for(let d=1;d<=dias;d++){const s=iso(new Date(y,m,d));
    const au=ausenciaEm(pid,s), esca=escDias[s];
    const cls=['d',esca?'esc':'',indisponivel(pid,s)?'no':'',au?'aus':'',
      (evDatas.has(s)&&!esca)?'ev':''].filter(Boolean).join(' ');
    /* escalado tem prioridade no toque: em vez de marcar indisponivel sem
       querer, a pessoa ve o que vai fazer naquele dia */
    const aviso=esca?esca.join(' · '):(au?au.motivo:'');
    const acao=esca||au
      ?'toast(\''+esc(aviso).replace(/'/g,'').replace(/\\/g,'')+'\')'
      :'toggleInd(\''+pid+'\',\''+s+'\')';
    h+='<div class="'+cls+'" title="'+esc(aviso)+'" onclick="'+acao+'">'+d+'</div>';}
  h+='</div><div class="legenda">'
   +'<span><i style="background:var(--ok);border-color:var(--ok)"></i>escalado</span>'
   +'<span><i style="background:var(--bad);border-color:var(--bad)"></i>não pode (dia avulso)</span>'
   +'<span><i style="background:repeating-linear-gradient(45deg,var(--warn),var(--warn) 3px,'
   +'transparent 3px,transparent 6px);border-color:var(--warn)"></i>período bloqueado</span>'
   +'<span><i style="box-shadow:inset 0 -3px 0 var(--brand)"></i>há culto no dia</span></div>'
   +'<div style="font-size:12px;color:var(--muted);margin-top:8px">Toque num dia livre para marcar que '
   +'<b>não</b> pode servir. Tocar num dia verde mostra a escala daquele dia.</div></div>';
  return h;
}
/* Escalado num dia que a propria pessoa marcou como indisponivel. Acontece
   quando o bloqueio vem depois da escala — o app nao desfaz nada sozinho,
   quem decide e o lider. */
function conflitosEscala(){
  return DB.escalas.filter(a=>{
    const e=evento(a.eventoId);
    return e&&e.data>=hojeIso()&&pessoa(a.pessoaId)&&ausente(a.pessoaId,e.data);
  }).sort((x,y)=>evento(x.eventoId).data.localeCompare(evento(y.eventoId).data));
}

function apagarPessoa(id){if(!exige('pessoas'))return;if(!confirm('Excluir este voluntário das escalas?'))return;
  DB.pessoas=DB.pessoas.filter(p=>p.id!==id);DB.escalas=DB.escalas.filter(a=>a.pessoaId!==id);
  DB.indisp=DB.indisp.filter(i=>i.pessoaId!==id);

function relatorio(){

function importar(inp){
  const f=inp.files[0]; if(!f)return;
  const r=new FileReader();
  /* passa pelo normalizar: backups antigos tem ids fora do formato UUID
     e seriam recusados pelo banco na primeira sincronizacao */
  r.onload=()=>{try{DB=normalizar(Object.assign(vazio(),JSON.parse(r.result)));save();render();
    toast('Backup restaurado');}
    catch(e){alert('Arquivo invalido');}};
  r.readAsText(f); inp.value='';
}

/* ---- COBRAR CONFIRMAÇÃO DE UM CULTO ------------------------------------
   Sexta-feira, culto no domingo, metade da equipe sem responder. Até aqui a
   única saída era mandar mensagem um por um.

   Isto entra na MESMA fila dos avisos automáticos: grava em DB.avisos, a
   sincronização leva para o banco, e o disparo que já roda de 5 em 5 minutos
   entrega. Nenhuma função nova no servidor — e, de quebra, quem estiver com
   o celular desligado encontra o recado em Avisos quando abrir o app. */
const COBRANCA_KEY='escala.cobranca';
function cobrancasFeitas(){
  try{return JSON.parse(localStorage.getItem(COBRANCA_KEY)||'{}')||{};}catch(e){return {};}
}
function marcarCobranca(evId){
  const m=cobrancasFeitas(); m[evId]=new Date().toISOString();
  try{localStorage.setItem(COBRANCA_KEY,JSON.stringify(m));}catch(e){}
}
const recebePush=pid=>naNuvem()
  ? (DB.pushAssinaturas||[]).some(x=>x.perfilId===pid)
  : !!(pessoa(pid)&&pessoa(pid).push);

function cobrarEvento(evId){
  if(!exige('escalas'))return;
  const ev=evento(evId); if(!ev)return toast('Evento não encontrado');
  const lista=DB.escalas.filter(a=>a.eventoId===evId);
  if(!lista.length)return toast('Ninguém escalado neste culto ainda');
  const pend=lista.filter(a=>a.status!=='confirmado');
  const mudos=lista.filter(a=>!recebePush(a.pessoaId)).length;

  let h='<p class="sub" style="margin:0 0 12px;padding:0">'+esc(ev.titulo)+' &middot; '
   +fmtLong(ev.data)+'</p>'
   +'<div class="card" style="margin:0 0 12px">'
   +linhaDado('Escalados',lista.length+' pessoa(s)')
   +linhaDado('Já confirmaram',String(lista.length-pend.length))
   +linhaDado('Sem responder',String(pend.length))
   +'</div>';
  if(!pend.length)h+='<div class="okbox" style="margin:0 0 12px">'
   +'Todo mundo já confirmou este culto.</div>';
  /* dizer isto antes evita a conclusão errada de que a notificação falhou */
  if(mudos)h+='<div class="warnbox" style="margin:0 0 12px">'+mudos+' pessoa(s) ainda não '
   +'ativaram as notificações. O recado fica em Avisos para elas, mas o celular '
   +'não vai tocar.</div>';
  h+='<label>Recado (opcional)</label>'
   +'<textarea id="cbTxt" rows="3" placeholder="Ex.: preciso fechar a escala até sexta."></textarea>';
  if(pend.length)h+='<button onclick="enviarCobranca(\''+evId+'\',\'pendentes\')">'
   +'Cobrar quem não confirmou ('+pend.length+')</button><div class="gap"></div>';
  h+='<button class="btn2" onclick="enviarCobranca(\''+evId+'\',\'todos\')">'
   +'Avisar todos os escalados ('+lista.length+')</button>';
  const ja=cobrancasFeitas()[evId];
  if(ja)h+='<p class="sub" style="font-size:13px;margin-top:12px">'
   +'Você já notificou este culto em '+fmt(String(ja).slice(0,10))+'.</p>';
  h+='<p class="sub" style="font-size:13px;margin-top:12px;line-height:1.6">'
   +'A notificação sai em poucos minutos.</p>';
  openSheet('Notificar a equipe',h,null);
}

function enviarCobranca(evId,quem){
  if(!exige('escalas'))return;
  const ev=evento(evId); if(!ev)return;
  const extra=val('cbTxt');
  const lista=DB.escalas.filter(a=>a.eventoId===evId)
    .filter(a=>quem==='todos'||a.status!=='confirmado');
  if(!lista.length){closeSheet();return toast('Ninguém para avisar');}
  /* cobrar duas vezes na mesma hora é o caminho mais curto para a equipe
     desligar as notificações do app */
  const ja=cobrancasFeitas()[evId];
  if(ja&&Date.now()-new Date(ja).getTime()<3600000
     &&!confirm('Você notificou este culto há menos de uma hora. Mandar de novo?'))return;

  const quando=fmtLong(ev.data);
  lista.forEach(a=>{
    const f=funcao(a.teamId,a.funcaoId);
    const onde=(f?f.nome+' em ':'')+ev.titulo+' ('+quando+'), chegada às '+chegada(ev,a.teamId)+'.';
    avisar(a.pessoaId,
      (quem==='todos'?'Você está escalado: ':'Confirme a sua presença: ')+onde
      +(extra?' — '+extra:''),
      'alerta', ev.id);
  });
  marcarCobranca(evId);
  save(); closeSheet(); render();
  toast(lista.length+' aviso(s) na fila');
}

function avisarLideres(texto,tipo,ref,exceto){

    .forEach(p=>avisar(p.id,texto,tipo,ref));
}
/* ---- BURACOS NA ESCALA -------------------------------------------------
   A semana antes do culto e a ultima janela boa para resolver: da tempo de
   pedir troca, chamar alguem, remanejar. Depois disso vira correria.
   O aviso sai uma vez por culto — repetir todo dia so ensinaria a ignorar. */
const DIAS_ALERTA_BURACO=7;
function eventosComBuraco(dias){
  const hoje=hojeIso(), limite=isoMaisDias(hoje,dias==null?DIAS_ALERTA_BURACO:dias);
  return DB.eventos.filter(ev=>{
    if(ev.data<hoje||ev.data>limite)return false;
    const s=statusEvento(ev);
    return s.total>s.preenchidos;
  }).sort((a,b)=>a.data.localeCompare(b.data));
}
function isoMaisDias(base,n){
  const d=pd(base); d.setDate(d.getDate()+n); return iso(d);
}
/* ---- PEDIDO DE TROCA PARADO -------------------------------------------
   Quem pede troca costuma achar que resolveu e para de acompanhar. Se
   ninguem assumir, o problema so aparece no dia do culto. Aqui o app
   devolve a bola para quem pediu, enquanto ainda da tempo de agir:
   dois dias esperando, ou o culto chegando — o que vier primeiro. */
const DIAS_TROCA_PARADA=2;
function diasDesde(iso8601){
  if(!iso8601)return 0;
  const q=new Date(iso8601).getTime();
  if(isNaN(q))return 0;
  return (Date.now()-q)/86400000;
}
function trocasParadas(pid){
  const hoje=hojeIso();
  return trocasAbertas().filter(t=>{
    if(t.deId!==pid)return false;
    const a=escalaPorId(t.escalaId), e=a&&evento(a.eventoId);
    if(!e||e.data<hoje)return false;              /* culto ja passou: nao adianta */
    return diasDesde(t.criada)>=DIAS_TROCA_PARADA||diasAte(e.data)<=DIAS_TROCA_PARADA;
  });
}
function textoTrocaParada(t){
  const a=escalaPorId(t.escalaId), e=evento(a.eventoId);
  const q=diasAte(e.data), n=candidatosTroca(t).length;
  return 'Ninguém assumiu o seu pedido de troca de '+descTroca(t)+'. '
   +(q<=0?'É hoje.':q===1?'É amanhã.':'Faltam '+q+' dias.')
   +(n?' '+n+' pessoa(s) podem assumir — vale chamar alguém direto.'
      :' Ninguém da equipe pode assumir. Fale com o líder.');
}
function verificarTrocasParadas(){
  if(!DB.sessao)return 0;
  let novos=0;
  trocasParadas(DB.sessao).forEach(t=>{
    if(DB.avisos.some(a=>a.tipo==='parada'&&a.ref===t.id&&a.paraId===DB.sessao))return;
    avisar(DB.sessao,textoTrocaParada(t),'parada',t.id);
    /* o lider tambem precisa saber que tem pedido encalhado */
    avisarLideres(pessoa(t.deId).nome+' pediu troca de '+descTroca(t)
      +' e ninguém assumiu ainda.','alerta',t.id,t.deId);
    novos++;
  });
  if(novos)save();
  return novos;
}
function verificarBuracos(){
  /* so quem monta a escala precisa saber disso */
  if(!DB.sessao||!euPosso('escalas'))return;
  let novos=0;
  eventosComBuraco().forEach(ev=>{
    if(DB.avisos.some(a=>a.tipo==='buraco'&&a.ref===ev.id&&a.paraId===DB.sessao))return;
    const s=statusEvento(ev);
    const faltam=s.total-s.preenchidos;
    const q=diasAte(ev.data);
    avisar(DB.sessao,faltam+' vaga(s) sem ninguém em '+ev.titulo+' ('+fmt(ev.data)+')'
      +(q===0?' — é hoje.':q===1?' — é amanhã.':' — faltam '+q+' dias.'),'buraco',ev.id);
    novos++;
  });
  if(novos)save();
  return novos;
}
const diasAte=iso=>Math.round((pd(iso)-pd(hojeIso()))/86400000);
const meusAvisos=()=>DB.avisos.filter(a=>a.paraId===DB.sessao)
  .sort((a,b)=>b.quando.localeCompare(a.quando));
const naoLidos=()=>DB.avisos.filter(a=>a.paraId===DB.sessao&&!a.lido).length;
function lerAvisos(){DB.avisos.forEach(a=>{if(a.paraId===DB.sessao)a.lido=true;});save();}
function quandoTxt(iso8601){
  const d=new Date(iso8601), min=Math.round((Date.now()-d)/60000);
  if(min<1)return 'agora';
  if(min<60)return min+' min atras';
  if(min<1440)return Math.round(min/60)+'h atras';
  return Math.round(min/1440)+'d atras';
}

/* ============ TROCAS ============ */
const escalaPorId=id=>DB.escalas.find(a=>a.id===id);
/* Uma troca so pode ser desenhada na tela se der para resolver TUDO o que ela
   referencia. No aparelho de um voluntario isso nem sempre acontece: o banco
   deixa ele ver os pedidos da igreja, mas nao as escalas nem os cadastros das
   outras pessoas. Antes, uma linha assim rebentava a tela inteira. */
/* Pedido aberto cuja vaga JÁ mudou de dono. Acontecia quando a gravação de
   escalas subia e a de trocas falhava — a vaga trocava e o pedido continuava
   no mural, chamando gente para uma vaga que não existe mais. Aqui o app
   fecha sozinho o que está evidentemente resolvido. */
function repararTrocas(){
  let n=0;
  DB.trocas.forEach(t=>{
    if(t.status!=='aberta')return;
    const a=escalaPorId(t.escalaId); if(!a)return;
    if(a.pessoaId===t.deId)return;
    t.status='aceita'; t.aceitaPor=a.pessoaId;
    t.respondida=t.respondida||new Date().toISOString();
    DB.avisos.forEach(x=>{if(x.ref===t.id&&x.tipo==='troca')x.lido=true;});
    n++;
  });
  if(n)save();
  return n;
}
/* ---- pedidos de culto que ja passou ------------------------------------
   Pedido de troca de um domingo que ja foi nao e pedido: e entulho. Ficava
   no mural, contava na bolinha da aba e escondia o que ainda da para
   resolver. Na abertura do app, e ao abrir a tela de Trocas, esses pedidos
   sao fechados como 'expirada' — some para todo mundo, e a contagem volta a
   dizer a verdade.
   Uma permuta amarrada a um pedido que expirou vai junto: sem a outra ponta
   ela nao tem como fechar. */
function trocaVencida(t){
  const a=escalaPorId(t.escalaId);
  if(!a)return true;                       /* escala sumiu: nao ha o que assumir */
  const e=evento(a.eventoId);
  return !e||e.data<hojeIso();
}
function expirarTrocas(){
  let n=0;
  const fechar=t=>{
    t.status='expirada';
    t.respondida=t.respondida||new Date().toISOString();
    DB.avisos.forEach(x=>{if(x.ref===t.id&&x.tipo==='troca')x.lido=true;});
    n++;
  };
  DB.trocas.forEach(t=>{ if(t.status==='aberta'&&trocaVencida(t))fechar(t); });
  /* segunda passada: propostas presas a um pedido que acabou de expirar */
  DB.trocas.forEach(t=>{
    if(t.status!=='aberta'||!t.permutaDe)return;
    const base=DB.trocas.find(x=>x.id===t.permutaDe);
    if(!base||base.status!=='aberta')fechar(t);
  });
  if(n)save();
  return n;
}
function trocaCompleta(t){
  if(!t)return false;
  const a=escalaPorId(t.escalaId); if(!a)return false;
  if(!evento(a.eventoId))return false;
  if(!pessoa(t.deId))return false;
  return true;
}
function trocasAbertas(){return DB.trocas.filter(t=>t.status==='aberta'&&trocaCompleta(t));}
function podeAssumir(t,pid){
  const a=escalaPorId(t.escalaId); if(!a)return false;
  const ev=evento(a.eventoId); if(!ev||ev.data<hojeIso())return false;
  const p=pessoa(pid);
  if(!p||pid===a.pessoaId)return false;
  if(!p.funcaoIds.includes(a.funcaoId))return false;              // precisa saber a funcao
  if(ausente(pid,ev.data))return false;                            // nao pode na data
  if(DB.escalas.some(x=>x.eventoId===ev.id&&x.pessoaId===pid))return false; // ja serve no culto
  return true;
}
function candidatosTroca(t){return DB.pessoas.filter(p=>podeAssumir(t,p.id));}

/* ---- PERMUTA ----------------------------------------------------------
   O problema que isto resolve: com todo mundo pedindo troca e ninguem
   assumindo, os pedidos se acumulam. Numa permuta a pessoa nao so pede —
   ela oferece a propria vaga em troca da de quem ja pediu. Os dois saem
   da data que atrapalha e os dois pedidos se resolvem de uma vez.
   As duas pontas precisam ser validas: eu consigo assumir a vaga dela E
   ela consegue assumir a minha. */
function permutasPara(escalaId,pid){
  if(!escalaPorId(escalaId))return [];
  const minha={escalaId:escalaId};
  return trocasAbertas().filter(t=>
    t.deId!==pid && !t.permutaDe && t.escalaId!==escalaId
    && podeAssumir(t,pid)              /* eu assumo a vaga dela */
    && podeAssumir(minha,t.deId));     /* ela assume a minha */
}
/* pedidos abertos de outras pessoas que EU poderia cobrir */
function possoCobrir(pid){
  return trocasAbertas().filter(t=>t.deId!==pid&&podeAssumir(t,pid)
    &&!(t.paraId&&t.paraId!==pid));
}
function descTroca(t){
  const a=escalaPorId(t.escalaId); if(!a)return '';
  const ev=evento(a.eventoId), f=funcao(a.teamId,a.funcaoId);
  return (f?f.nome:'')+' em '+ev.titulo+' ('+fmt(ev.data)+')';
}
function descEscala(aid){
  const a=escalaPorId(aid); if(!a)return '';
  const ev=evento(a.eventoId), f=funcao(a.teamId,a.funcaoId);
  return (f?f.nome:'')+' em '+ev.titulo+' ('+fmt(ev.data)+')';
}
/* Proposta de permuta: vira um pedido direto para a pessoa, amarrado ao
   pedido dela. Quem recebe decide — ninguem e escalado sem aceitar. */
function pedirPermuta(escalaId,tid,motivo){
  const t=DB.trocas.find(x=>x.id===tid);
  if(!t||t.status!=='aberta'){toast('Esse pedido não está mais aberto');return false;}
  const a=escalaPorId(escalaId); if(!a)return false;
  if(trocaDaEscala(escalaId)){toast('Já existe um pedido em aberto');return false;}
  if(!podeAssumir(t,a.pessoaId)){toast('Você não pode assumir aquela vaga');return false;}
  if(!podeAssumir({escalaId:escalaId},t.deId)){
    toast('A outra pessoa não pode assumir a sua vaga');return false;}
  const eu=pessoa(a.pessoaId);
  const novo={id:uid(),escalaId:escalaId,deId:a.pessoaId,paraId:t.deId,motivo:motivo||'',
    status:'aberta',permutaDe:t.id,criada:new Date().toISOString()};
  DB.trocas.push(novo);
  avisar(t.deId,eu.nome+' propôs uma permuta: assume o seu '+descTroca(t)
    +' se você assumir o '+descEscala(escalaId)+'.','troca',novo.id);
  avisarLideres(eu.nome+' propôs permuta com '+pessoa(t.deId).nome+'.','troca',novo.id,a.pessoaId);
  save();
  toast('Permuta proposta');
}
function trocaDaEscala(aid){return DB.trocas.find(t=>t.escalaId===aid&&t.status==='aberta');}
function pedirTroca(escalaId,paraId,motivo){
  const a=escalaPorId(escalaId); if(!a)return;
  if(trocaDaEscala(escalaId)){toast('Já existe um pedido em aberto');return false;}
  const ev=evento(a.eventoId), f=funcao(a.teamId,a.funcaoId), de=pessoa(a.pessoaId);
  const t={id:uid(),escalaId,deId:a.pessoaId,paraId:paraId||null,motivo:motivo||'',
    status:'aberta',criada:new Date().toISOString()};
  DB.trocas.push(t);
  const desc=f.nome+' em '+ev.titulo+' ('+fmt(ev.data)+')';
  let aptos=[];
  if(paraId)avisar(paraId,de.nome+' pediu que você assuma '+desc+'.','troca',t.id);
  else{
    aptos=DB.pessoas.filter(p=>podeAssumir(t,p.id));
    aptos.forEach(p=>avisar(p.id,'Vaga aberta para troca: '+desc+'. '+de.nome+' precisa de alguém.','troca',t.id));
  }
  /* Pedido que ninguem pode assumir precisa ser dito na cara: antes o app
     respondia "publicado no mural" e a pessoa ia embora achando que estava
     resolvido, quando na verdade o aviso nao chegou a ninguem. */
  const semGente=!paraId&&!aptos.length;
  avisarLideres(de.nome+' pediu troca de '+desc+'.'
    +(semGente?' NINGUÉM da equipe pode assumir — precisa da sua ajuda.':''),
    semGente?'alerta':'troca',t.id,a.pessoaId);
  save();
  if(semGente)toast('Pedido registrado, mas ninguém pode assumir. O líder foi avisado.');
  else toast(paraId?'Pedido enviado':'Pedido enviado para '+aptos.length+' pessoa(s)');
}
/* jaNoServidor = a transação do banco já rodou; aqui só espelhamos o
   resultado e criamos os avisos, sem revalidar o que o servidor já validou. */
function aceitarTroca(tid,porId,jaNoServidor){
  const t=DB.trocas.find(x=>x.id===tid); if(!t||t.status!=='aberta')return toast('Pedido não está mais aberto');
  if(!jaNoServidor&&!podeAssumir(t,porId))return toast('Você não pode assumir esta posição');
  /* Numa permuta as duas pontas tem de valer ANTES de mexer em qualquer
     coisa, senao a troca ficaria pela metade: um sai e o outro nao entra. */
  let outra=null,escOutra=null;
  if(t.permutaDe){
    outra=DB.trocas.find(x=>x.id===t.permutaDe);
    if(!outra||outra.status!=='aberta')
      return toast('A outra ponta da permuta não está mais aberta');
    escOutra=escalaPorId(outra.escalaId);
    if(!escOutra||(!jaNoServidor&&!podeAssumir(outra,t.deId)))
      return toast('A permuta não é mais possível');
  }
  const a=escalaPorId(t.escalaId); const ev=evento(a.eventoId), f=funcao(a.teamId,a.funcaoId);
  const antigo=pessoa(a.pessoaId), novo=pessoa(porId);
  a.pessoaId=porId; a.status='confirmado';
  t.status='aceita'; t.aceitaPor=porId; t.respondida=new Date().toISOString();
  const desc=f.nome+' em '+ev.titulo+' ('+fmt(ev.data)+')';
  if(outra){
    /* a segunda metade: quem propos a permuta assume a vaga do outro */
    const descB=descEscala(outra.escalaId);
    escOutra.pessoaId=t.deId; escOutra.status='confirmado';
    outra.status='aceita'; outra.aceitaPor=t.deId; outra.respondida=new Date().toISOString();
    avisar(antigo.id,'Permuta fechada: você assumiu '+descB+' e '+novo.nome
      +' assumiu '+desc+'.','ok',t.id);
    avisar(novo.id,'Permuta fechada: você assumiu '+desc+' e '+antigo.nome
      +' assumiu '+descB+'.','ok',t.id);
    avisarLideres('Permuta entre '+antigo.nome+' e '+novo.nome+': '+desc
      +' e '+descB+'.','ok',t.id,porId);
    DB.avisos.forEach(x=>{if((x.ref===t.id||x.ref===outra.id)&&x.tipo==='troca')x.lido=true;});
    save(); toast('Permuta fechada. Vocês trocaram de data.');
    return;
  }
  avisar(antigo.id,novo.nome+' assumiu a sua vaga de '+desc+'. Troca resolvida.','ok',t.id);
  avisarLideres(novo.nome+' assumiu o lugar de '+antigo.nome+' em '+desc+'.','ok',t.id,porId);
  // silencia só as convocações do mural, nunca os avisos de resultado
  DB.avisos.forEach(x=>{if(x.ref===t.id&&x.tipo==='troca')x.lido=true;});
  save(); toast('Troca confirmada. Você assumiu a vaga.');
}
function recusarTroca(tid,porId){
  const t=DB.trocas.find(x=>x.id===tid); if(!t||t.status!=='aberta')return;
  if(t.paraId===porId){                       // pedido direto recusado vira mural
    t.paraId=null; t.recusadoPor=(t.recusadoPor||[]).concat(porId);
    /* permuta recusada vira pedido comum: sem isto, quem aceitasse depois
       jogaria a outra pessoa numa data que ela nunca aceitou */
    t.permutaDe=null;
    const a=escalaPorId(t.escalaId), ev=evento(a.eventoId), f=funcao(a.teamId,a.funcaoId);
    avisar(t.deId,pessoa(porId).nome+' não pode assumir. O pedido foi para o mural geral.','info',t.id);
    DB.pessoas.filter(p=>podeAssumir(t,p.id))
      .forEach(p=>avisar(p.id,'Vaga aberta para troca: '+f.nome+' em '+ev.titulo+' ('+fmt(ev.data)+').','troca',t.id));
    save(); toast('Recusado. O pedido foi para o mural.');
  }else{
    t.recusadoPor=(t.recusadoPor||[]).concat(porId);
    DB.avisos.forEach(x=>{if(x.ref===t.id&&x.paraId===porId)x.lido=true;});
    save(); toast('Ok, não vamos te avisar de novo sobre esta vaga.');
  }
}
function cancelarTroca(tid){
  const t=DB.trocas.find(x=>x.id===tid); if(!t)return;
  t.status='cancelada'; DB.avisos.forEach(x=>{if(x.ref===t.id&&x.tipo==='troca')x.lido=true;});
  save(); toast('Pedido cancelado'); render();
}

/* ============ AUSENCIAS (periodos bloqueados) ============ */
function criarAusencia(pid,inicio,fim,motivo){
  if(!inicio||!fim)return toast('Informe as duas datas'),false;
  if(fim<inicio)return toast('A data final vem depois da inicial'),false;
  if(!motivo||!motivo.trim())return toast('Descreva o motivo'),false;
  const dias=diasDoPeriodo(inicio,fim), lim=limiteBloqueio();
  const ja=diasBloqueados(pid,pd(inicio).getFullYear());
  if(lim&&ja+dias>lim){
    toast('Limite de '+lim+' dias por ano. Você já tem '+ja+'.');return false;}
  DB.ausencias.push({id:uid(),pessoaId:pid,inicio,fim,motivo:motivo.trim(),
    criada:new Date().toISOString()});
  const p=pessoa(pid);
  const conflitos=DB.escalas.filter(a=>{const e=evento(a.eventoId);
    return a.pessoaId===pid&&e&&e.data>=inicio&&e.data<=fim;});
  avisarLideres(p.nome+' bloqueou '+fmt(inicio)+' a '+fmt(fim)+' ('+motivo.trim()+')'
    +(conflitos.length?' e já está escalado em '+conflitos.length+' culto(s) no período.':'.'),
    conflitos.length?'alerta':'info',null,pid);
  save();
  if(conflitos.length)toast('Bloqueado. Atenção: '+conflitos.length+' escala(s) no período.');
  else toast('Período bloqueado');
  return true;
}
function removerAusencia(id){
  if(!confirm('Remover este bloqueio?'))return;
  DB.ausencias=DB.ausencias.filter(a=>a.id!==id);save();render();
}
function formAusencia(pid){
  const lim=limiteBloqueio(), ja=diasBloqueados(pid);
  return '<label>Do dia</label><input id="auI" type="date" value="'+hojeIso()+'">'
   +'<label>Até o dia</label><input id="auF" type="date" value="'+hojeIso()+'">'
   +'<label>Motivo</label><input id="auM" placeholder="Viagem de família, cirurgia, trabalho...">'
   +'<p style="font-size:13px;color:var(--muted);margin:2px 0 0">'
   +(lim?'Você pode bloquear até <b>'+lim+' dias por ano</b>. Já usou '+ja+'.'
        :'Sem limite de dias definido pelo líder.')
   +'<br>Durante o período o app não escala você automaticamente.</p>';
}
function novaAusencia(pid){
  openSheet('Bloquear período',formAusencia(pid),
    ()=>criarAusencia(pid,val('auI'),val('auF'),val('auM')));
}
