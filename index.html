      recusado_por:t.recusadoPor||[],permuta_de:t.permutaDe||null})),
    avisos:db.avisos.map(a=>({id:a.id,para_id:a.paraId,texto:a.texto,tipo:a.tipo,
      ref:a.ref||null,lido:!!a.lido,quando:a.quando})),
  };
}
function montar(dados){
  /* caminho inverso: linhas do banco -> objeto DB do app */
  const d=vazio();
  const ig=(dados.igrejas||[])[0]||{};
  d.igrejaId=ig.id||null;
  d.config={igreja:ig.nome||'',limiteBloqueio:ig.limite_bloqueio==null?30:ig.limite_bloqueio,
    vapid:ig.vapid_public||'',whatsapp:false,
    aviso:{canal:ig.aviso_canal||'push',aoEscalar:ig.aviso_ao_escalar!==false,
      dias:ig.aviso_dias||[1],hora:(ig.aviso_hora||'10:00').slice(0,5)}};
  const fPorEquipe={};
  (dados.funcoes||[]).forEach(f=>{(fPorEquipe[f.equipe_id]=fPorEquipe[f.equipe_id]||[]).push(f);});
  d.teams=(dados.equipes||[]).map(t=>({id:t.id,nome:t.nome,cor:t.cor,antecedencia:t.antecedencia,
    funcoes:(fPorEquipe[t.id]||[]).sort((a,b)=>(a.ordem||0)-(b.ordem||0))
      .map(f=>({id:f.id,nome:f.nome,qtd:f.qtd}))}));
  const habs={};
  (dados.habilidades||[]).forEach(h=>{(habs[h.perfil_id]=habs[h.perfil_id]||[]).push(h.funcao_id);});
  const equipeDaFuncao={};
  (dados.funcoes||[]).forEach(f=>equipeDaFuncao[f.id]=f.equipe_id);
  d.pessoas=(dados.perfis||[]).map(p=>{
    const fids=habs[p.id]||[];
    return{id:p.id,nome:p.nome,telefone:p.telefone||'',email:p.email||'',
      nascimento:p.nascimento||'',codigo:p.codigo,perms:p.perms||{},
      entrou:p.entrou_em||null,funcaoIds:fids,
      /* quem manda na validade do codigo e o banco: o app so mostra */
      codigoExpira:p.codigo_expira_em||null,codigoUsos:p.codigo_usos||0,
      teamIds:[...new Set(fids.map(fid=>equipeDaFuncao[fid]).filter(Boolean))]};
  });
  /* Nomes de quem o banco nao deixa este usuario ler por inteiro. Entram como
     somente-leitura: aparecem na tela, mas nunca sao enviados de volta. */
  const jaTem={}; d.pessoas.forEach(p=>jaTem[p.id]=true);
  (dados.pessoas_publicas||[]).forEach(x=>{
    if(jaTem[x.id])return;
    d.pessoas.push({id:x.id,nome:x.nome,telefone:'',email:'',nascimento:'',codigo:'',
      perms:{},funcaoIds:[],teamIds:[],externa:true});
  });
  const eqPorEvento={};
  (dados.eventos_equipes||[]).forEach(x=>{(eqPorEvento[x.evento_id]=eqPorEvento[x.evento_id]||[]).push(x);});
  d.eventos=(dados.eventos||[]).map(e=>{
    const ls=eqPorEvento[e.id]||[], ch={};
    ls.forEach(x=>{if(x.chegada)ch[x.equipe_id]=String(x.chegada).slice(0,5);});
    return{id:e.id,titulo:e.titulo,data:e.data,hora:String(e.hora).slice(0,5),
      teamIds:ls.map(x=>x.equipe_id),chegadas:ch,
      obs:e.obs||'',links:Array.isArray(e.links)?e.links:[]};
  });
  d.escalas=(dados.escalas||[]).map(a=>{
    const tid=equipeDaFuncao[a.funcao_id];
    return{id:a.id,eventoId:a.evento_id,teamId:tid,funcaoId:a.funcao_id,idx:a.slot||0,
      pessoaId:a.perfil_id,status:a.status,avisos:a.avisos||{}};
  });
  d.indisp=(dados.indisponibilidades||[]).map(i=>({pessoaId:i.perfil_id,data:i.data}));
  d.ausencias=(dados.ausencias||[]).map(a=>({id:a.id,pessoaId:a.perfil_id,inicio:a.inicio,
    fim:a.fim,motivo:a.motivo}));
  d.trocas=(dados.trocas||[]).map(t=>({id:t.id,escalaId:t.escala_id,deId:t.de_id,paraId:t.para_id,
    aceitaPor:t.aceita_por,motivo:t.motivo,status:t.status,recusadoPor:t.recusado_por||[],
    permutaDe:t.permuta_de||null,criada:t.criada_em||null}));
  d.avisos=(dados.avisos||[]).map(a=>({id:a.id,paraId:a.para_id,texto:a.texto,tipo:a.tipo,
    ref:a.ref,lido:a.lido,quando:a.quando}));
  /* so leitura: quem tem aparelho registrado para receber notificacao */
  d.pushAssinaturas=(dados.push_assinaturas||[]).map(x=>({perfilId:x.perfil_id,
    aparelho:x.aparelho,endpoint:x.endpoint}));
  return d;
}

/* ---- verificacao de edicao simultanea ----------------------------------
   Nao ha coluna de versao no banco, entao a checagem viaja na propria
   gravacao: alem da chave, o UPDATE exige que as colunas que mudaram ainda
   estejam com o valor antigo. Se outra pessoa mexeu, nenhuma linha casa.
   Colunas de lista ou objeto (jsonb) ficam de fora da comparacao: nao da
   para compara-las com igualdade simples no PostgREST. */
const comparavel=v=>v===null||v===undefined||typeof v==='string'
  ||typeof v==='number'||typeof v==='boolean';
function colunasComparaveis(antes,agora){
  if(!antes)return [];
  return Object.keys(agora).filter(k=>
    JSON.stringify(antes[k])!==JSON.stringify(agora[k])&&comparavel(antes[k]));
}
function indicePor(tab,linhas){
  const m={}; (linhas||[]).forEach(l=>{m[chaveDe(tab,l)]=l;}); return m;
}
const NOME_TABELA={escalas:'a escala',eventos:'o culto',trocas:'o pedido de troca',
  perfis:'o cadastro de alguém',equipes:'a equipe',funcoes:'a função',
  avisos:'um aviso',ausencias:'o período bloqueado',
  indisponibilidades:'um dia bloqueado',eventos_equipes:'as equipes do culto',
  habilidades:'as funções de alguém'};
function descreveConflitos(lista){
  const quais=[...new Set(lista.map(c=>NOME_TABELA[c.tab]||c.tab))];
  return 'Alguém alterou '+quais.join(' e ')+' antes de você. Recarreguei o que está no servidor.';
}
/* traz a foto do servidor por cima do que esta aqui, preservando so o que e
   deste aparelho (quem entrou, se o convite de instalacao ja foi dispensado) */
async function recarregarDoServidor(){
  const dados=await nuvemBaixar();
  if(!dados.perfis||!dados.perfis.length)return false;
  const antes=SNAP?JSON.stringify(SNAP):'';
  const novo=montar(dados);
  DB=normalizar(Object.assign(novo,{sessao:DB.sessao,ultimoAcesso:DB.ultimoAcesso,
    meuId:DB.meuId,instalarOculto:DB.instalarOculto}));
  SNAP=achatar(DB); ULTIMO_SYNC=new Date().toISOString();
  try{localStorage.setItem(KEY,JSON.stringify(DB));}catch(e){}
  return JSON.stringify(SNAP)!==antes;
}

/* chave primaria de cada tabela, para o diff saber comparar */
const CHAVES={equipes:['id'],funcoes:['id'],perfis:['id'],habilidades:['perfil_id','funcao_id'],
  eventos:['id'],eventos_equipes:['evento_id','equipe_id'],escalas:['id'],
  indisponibilidades:['perfil_id','data'],ausencias:['id'],trocas:['id'],avisos:['id']};
const chaveDe=(t,l)=>CHAVES[t].map(k=>l[k]).join('|');

/* compara duas fotos e devolve o que inserir/atualizar e o que apagar */
function diff(antes,agora){
  const plano={};
  Object.keys(CHAVES).forEach(tab=>{
    const a={},b={};
    (antes[tab]||[]).forEach(l=>a[chaveDe(tab,l)]=l);
    (agora[tab]||[]).forEach(l=>b[chaveDe(tab,l)]=l);
    const inserir=[],alterar=[],apagar=[];
    Object.keys(b).forEach(k=>{
      if(!a[k])inserir.push(b[k]);
      else if(JSON.stringify(a[k])!==JSON.stringify(b[k]))alterar.push(b[k]);
    });
    Object.keys(a).forEach(k=>{if(!b[k])apagar.push(a[k]);});
    if(inserir.length||alterar.length||apagar.length)plano[tab]={inserir,alterar,apagar};
  });
  return plano;
}
/* ordem importa: pai antes de filho ao gravar, filho antes de pai ao apagar */
const ORDEM=['equipes','funcoes','perfis','habilidades','eventos','eventos_equipes',
  'escalas','indisponibilidades','ausencias','trocas','avisos'];

/* ---- janela de sincronizacao -------------------------------------------
   Baixar o banco inteiro a cada abertura funciona no primeiro ano e vai
   ficando lento sozinho: dois anos de escalas sao milhares de linhas que o
   celular baixa so para mostrar o proximo domingo. O app passa a trazer uma
   janela de 12 meses para tras, mais tudo o que e futuro — que e o quanto o
   rodizio, o relatorio e a tela de anteriores precisam enxergar.
   O diff nao apaga o que ficou de fora porque essas linhas tambem nao estao
   aqui: ele compara a foto do que veio com o que existe no aparelho. */
const JANELA_SYNC_DIAS=365;
function corteSync(){
  const d=new Date(); d.setDate(d.getDate()-JANELA_SYNC_DIAS); return iso(d);
}
const dentroDaJanela=data=>!data||String(data)>=corteSync();
/* tabelas que crescem com o tempo e por isso vem pela janela */
const TABELAS_JANELA=['eventos','eventos_equipes','escalas','indisponibilidades',
  'ausencias','trocas','avisos'];
/* o .in() do PostgREST vai na URL: com mil ids a requisicao estoura */
async function emLotes(lista,tamanho,fn){
  const saida=[];
  for(let i=0;i<lista.length;i+=tamanho){
    const parte=await fn(lista.slice(i,i+tamanho));
    if(parte&&parte.length)saida.push.apply(saida,parte);
  }
  return saida;
}
async function nuvemBaixar(){
  const corte=corteSync();
  const dados={};
  const pega=async(t,filtro)=>{
    let q=SB.from(t).select('*');
    if(filtro)q=filtro(q);
    const{data,error}=await q;
    if(error)throw new Error(t+': '+error.message);
    dados[t]=data||[];
    return dados[t];
  };
  /* cadastro da igreja: pequeno e sempre inteiro */
  for(const t of ['igrejas','equipes','funcoes','perfis','habilidades','push_assinaturas'])
    await pega(t);
  const eventos=await pega('eventos',q=>q.gte('data',corte));
  await pega('indisponibilidades',q=>q.gte('data',corte));
  await pega('ausencias',q=>q.gte('fim',corte));
  await pega('avisos',q=>q.gte('quando',new Date(corte+'T00:00:00').toISOString()));
  const evIds=eventos.map(e=>e.id);
  dados.eventos_equipes=await emLotes(evIds,200,async parte=>{
    const{data,error}=await SB.from('eventos_equipes').select('*').in('evento_id',parte);
    if(error)throw new Error('eventos_equipes: '+error.message); return data;});
  dados.escalas=await emLotes(evIds,200,async parte=>{
    const{data,error}=await SB.from('escalas').select('*').in('evento_id',parte);
    if(error)throw new Error('escalas: '+error.message); return data;});
  dados.trocas=await emLotes(dados.escalas.map(a=>a.id),200,async parte=>{
    const{data,error}=await SB.from('trocas').select('*').in('escala_id',parte);
    if(error)throw new Error('trocas: '+error.message); return data;});
  /* So os nomes da igreja, para o voluntario saber quem pediu a troca.
     Opcional de proposito: bancos que ainda nao rodaram a migracao seguem
     funcionando, apenas sem os nomes das outras pessoas. */
  try{
    const{data}=await SB.from('pessoas_publicas').select('*');
    dados.pessoas_publicas=data||[];
  }catch(e){dados.pessoas_publicas=[];}
  return dados;
}
async function nuvemEnviar(){
  /* depois de um erro o estado fica 'erro'; ainda assim precisamos tentar de
     novo na proxima alteracao, senao o app nunca mais sincroniza sozinho. */
  if(!SB||!SNAP||NUVEM_ESTADO==='off'||NUVEM_ESTADO==='ligando')return;
  /* offline nao e erro: as mudancas ficam guardadas e sobem quando a barra
     voltar. Tentar agora so produziria uma faixa vermelha assustadora. */
  if(!ONLINE)return;
  if(SALVANDO){PENDENTE=true;return;}
  SALVANDO=true;
  /* Guarda o que JA subiu. Antes, uma falha na 7a tabela descartava o
     progresso das 6 primeiras: na tentativa seguinte o app reenviava
     linhas que ja estavam no banco e levava "duplicate key" para sempre. */
  const parcial=Object.assign({},SNAP);
  const conflitos=[];
  try{
    const agora=achatar(DB);
    const plano=diff(SNAP,agora);
    for(const tab of ORDEM){
      const p=plano[tab]; if(!p){parcial[tab]=agora[tab];continue;}
      for(const l of p.apagar){
        let q=SB.from(tab).delete();
        CHAVES[tab].forEach(k=>{q=q.eq(k,l[k]);});
        const{error}=await q; if(error)throw new Error(tab+' (apagar): '+error.message);
      }
      /* linha que ja existia -> UPDATE. Linha nova -> INSERT.
         Com upsert, editar o proprio cadastro exigia permissao de criar
         pessoas, e o voluntario levava "permission denied". */
      const antesDaTabela=indicePor(tab,SNAP[tab]);
      for(const l of p.alterar){
        const antes=antesDaTabela[chaveDe(tab,l)];
        let q=SB.from(tab).update(semNulo(l));
        CHAVES[tab].forEach(k=>{q=q.eq(k,l[k]);});
        /* So grava se a linha ainda estiver como estava quando a baixamos.
           Duas pessoas montando a mesma escala ao mesmo tempo era o pior caso
           silencioso do app: a ultima a salvar apagava o trabalho da outra sem
           ninguem perceber. Agora a gravacao nao casa, o app recarrega e diz. */
        const guardas=colunasComparaveis(antes,l);
        guardas.forEach(k=>{ q = antes[k]===null||antes[k]===undefined ? q.is(k,null) : q.eq(k,antes[k]); });
        const{data,error}=await q.select(CHAVES[tab][0]);
        if(error)throw new Error(tab+' (alterar): '+error.message);
        if(guardas.length&&(!data||!data.length))conflitos.push({tab,linha:l});
      }
      if(p.inserir.length){
        const{error}=await SB.from(tab).insert(p.inserir.map(semNulo));
        if(error)throw new Error(tab+' (inserir): '+error.message);
      }
      parcial[tab]=agora[tab];   /* esta tabela ficou em dia */
    }
    /* alguem alterou antes: a verdade passa a ser a do servidor */
    if(conflitos.length){
      await recarregarDoServidor();
      NUVEM_ESTADO='on'; NUVEM_ERRO='';
      toast(descreveConflitos(conflitos));
      try{render();}catch(e){}
      return;
    }
    /* configuracao da igreja fica em colunas, nao em tabela */
    if(DB.igrejaId){
      const c=cfgAviso();
      const{error}=await SB.from('igrejas').update({
        nome:DB.config.igreja||'',limite_bloqueio:limiteBloqueio(),
        vapid_public:chaveVapid()||null,aviso_canal:c.canal,aviso_ao_escalar:c.aoEscalar,
        aviso_dias:c.dias,aviso_hora:c.hora}).eq('id',DB.igrejaId);
      if(error)throw new Error('igrejas: '+error.message);
    }
    SNAP=agora; NUVEM_ERRO=''; ULTIMO_SYNC=new Date().toISOString();
    if(NUVEM_ESTADO==='erro')NUVEM_ESTADO='on';   /* voltou a funcionar */
  }catch(err){
    /* marcar o estado e o que faz a faixa de aviso aparecer nas telas.
       Sem isso o erro ficava so num toast de 2 segundos. */
    NUVEM_ESTADO='erro';
    NUVEM_ERRO=err.message||String(err);
    SNAP=parcial;              /* mantem o que ja subiu, para nao duplicar */
    toast('Não consegui salvar na nuvem');
    try{render();}catch(e){}
  }finally{
    SALVANDO=false;
    if(PENDENTE){PENDENTE=false;setTimeout(nuvemEnviar,300);}
  }
}
/* ============ DIAGNOSTICO DA NUVEM ============
   Percorre TODAS as tabelas sem parar no primeiro erro e mostra, para cada
   uma: quanto existe aqui, quanto existe no banco e o que falhou ao gravar.
   Serve para achar a causa sem precisar abrir o console do navegador. */
async function diagnosticoNuvem(){
  if(!nuvemCfg())return toast('Este aparelho não está ligado à nuvem');
  openSheet('Diagnóstico da nuvem',
    '<div class="empty">Testando cada tabela&hellip;<br>Isso leva alguns segundos.</div>',null);
  const linhas=[];
  try{
    if(!SB)SB=await criarCliente();
    /* migracoes que o app espera encontrar: sem elas algumas telas ficam
       incompletas sem dizer por que */
    const extras=[];
    for(const [obj,arquivo] of [['pessoas_publicas','migracao-trocas-visiveis.sql']]){
      const{error}=await SB.from(obj).select('*',{count:'exact',head:true});
      extras.push({obj,arquivo,ok:!error,msg:error?error.message:''});
    }
    /* colunas que o app grava. Faltando uma, a sincronizacao inteira para
       naquela tabela — e a mensagem do banco não diz qual script resolve. */
    for(const [tab,col,arquivo] of [
      ['trocas','permuta_de','migracao-permuta.sql'],
      ['trocas','alerta_parada','migracao-troca-parada.sql'],
      ['eventos','alerta_buraco','migracao-alerta-buracos.sql'],
      ['eventos','obs','migracao-info-culto.sql'],
      ['perfis','codigo_expira_em','migracao-codigos-acesso.sql'],
      ['escalas','avisos','push-1-banco.sql']]){
      const{error}=await SB.from(tab).select(col,{count:'exact',head:true});
      if(error)extras.push({obj:tab+'.'+col,arquivo,ok:false,msg:error.message});
    }
    /* A regra antiga de trocas devolvia so os pedidos da propria pessoa.
       Comparar o que o banco entrega com o que existe de verdade e a unica
       forma de perceber isso de dentro do app. */
    try{
      const{data:eu}=await SB.rpc('meu_perfil');
      const{count:tudo}=await SB.from('trocas').select('*',{count:'exact',head:true});
      const{count:meus}=await SB.from('trocas').select('*',{count:'exact',head:true}).eq('de_id',eu);
      if(tudo!=null&&meus!=null&&tudo>0&&tudo===meus&&!euPosso('trocas')&&!euPosso('escalas'))
        extras.push({obj:'regra de trocas',arquivo:'migracao-trocas-funcionar.sql',ok:false,
          msg:'o banco só está devolvendo os seus próprios pedidos ('+meus+' de '+tudo
             +'), então o mural da equipe não aparece'});
    }catch(e){}
    /* funcoes que nao tem tabela para testar: so a chamada revela se existem */
    for(const [fn,arg,arquivo] of [['tenho_agenda',{},'migracao-agenda.sql']]){
      try{
        const{error}=await SB.rpc(fn,arg);
        if(error)extras.push({obj:'função '+fn,arquivo,ok:false,msg:error.message});
      }catch(e){extras.push({obj:'função '+fn,arquivo,ok:false,msg:String(e)});}
    }
    DIAG_EXTRAS=extras;
    const agora=achatar(DB);
    const plano=SNAP?diff(SNAP,agora):null;
    for(const tab of ORDEM){
      const r={tab,local:(agora[tab]||[]).length,nuvem:null,pendente:0,erro:''};
      const p=plano&&plano[tab];
      if(p)r.pendente=p.inserir.length+p.alterar.length+p.apagar.length;
      const{error}=await SB.from(tab).select('*',{count:'exact',head:true});
      if(error){r.erro='ler: '+error.message;linhas.push(r);continue;}
      /* tenta gravar o que esta pendente nesta tabela, sem abortar o resto */
      if(p){
        try{
          for(const l of p.apagar){
            let q=SB.from(tab).delete();
            CHAVES[tab].forEach(k=>{q=q.eq(k,l[k]);});
            const{error:e1}=await q; if(e1)throw new Error('apagar: '+e1.message);
          }
          for(const l of p.alterar){
            let q=SB.from(tab).update(semNulo(l));
            CHAVES[tab].forEach(k=>{q=q.eq(k,l[k]);});
            const{error:e2}=await q; if(e2)throw new Error('alterar: '+e2.message);
          }
          if(p.inserir.length){
            const{error:e3}=await SB.from(tab).insert(p.inserir.map(semNulo));
            if(e3)throw new Error('inserir: '+e3.message);
          }
          if(SNAP)SNAP[tab]=agora[tab];
        }catch(e){r.erro=e.message||String(e);}
      }
      /* conta DEPOIS de tentar gravar, senao o numero da nuvem sai defasado */
      const{count:c2}=await SB.from(tab).select('*',{count:'exact',head:true});
      r.nuvem=c2==null?0:c2;
      linhas.push(r);
    }
  }catch(e){
    return openSheet('Diagnóstico da nuvem',
      '<div class="warnbox" style="display:block">Não consegui rodar o teste.<br>'
      +esc(e.message||String(e))+'</div>',null);
  }
  const ruins=linhas.filter(r=>r.erro);
  const faltando=(DIAG_EXTRAS||[]).filter(x=>!x.ok);
  let h=faltando.length
    ? '<div class="warnbox" style="display:block;background:var(--bad-soft);color:var(--bad)">'
      +'<b>&#9888; Falta rodar migração no banco</b>'
      +faltando.map(x=>'<div style="font-weight:600;margin-top:5px">'+esc(x.arquivo)+'</div>'
        +'<div style="font-weight:500;font-size:12.5px;opacity:.85">'+esc(x.msg)+'</div>').join('')
      +'<div style="font-weight:600;margin-top:6px">Sem ela, os voluntários não enxergam os '
      +'pedidos de troca.</div></div>'
    : '';
  h+=ruins.length

/* Conectar: cria a sessao anonima, resgata o codigo e baixa tudo */
/* Conectar: abre a sessao anonima, resgata o codigo e baixa tudo.
   NUVEM_PASSO guarda em que etapa estamos, para o erro dizer ONDE quebrou. */
var NUVEM_PASSO='';
async function nuvemConectar(codigo){
  NUVEM_ESTADO='ligando'; NUVEM_ERRO=''; NUVEM_PASSO='abrindo a conexão'; render();
  try{
    NUVEM_PASSO='carregando a biblioteca do Supabase';
    SB=await criarCliente();
    if(!SB)throw new Error('Configuração da nuvem não encontrada.');

    NUVEM_PASSO='entrando (login anônimo)';
    const{data:sess}=await SB.auth.getSession();
    if(!sess||!sess.session){
      const{error}=await SB.auth.signInAnonymously();
      if(error)throw new Error(error.message
        +' — confira o passo 3 (Anonymous sign-ins) no painel do Supabase.');
    }

    if(codigo){
      NUVEM_PASSO='validando o código';
      const{error}=await SB.rpc('resgatar_convite',{p_codigo:codigo.toUpperCase().trim()});
      if(error)throw new Error(/vencido/i.test(error.message||'')
        ?'Este código venceu. Peça um novo a quem cuida da escala.'
        :error.message);
    }

    NUVEM_PASSO='baixando os dados';
    const dados=await nuvemBaixar();

    if(!dados.perfis.length){
      if(codigo)throw new Error('O código foi aceito, mas o banco não devolveu nenhum perfil. '
        +'Isso costuma ser regra de segurança (RLS) da tabela perfis.');
      /* sem código: a sessão ainda não está ligada a ninguém — pedir o código */
      NUVEM_ESTADO='precisa-codigo'; DB.sessao=null; MOSTRA_CODIGO=true; render();
      return false;
    }

    NUVEM_PASSO='montando o app';
    const novo=montar(dados);
    /* pergunta ao banco qual perfil e o meu: funciona com varios aparelhos */
    let meuIdNuvem=null;
    try{const{data}=await SB.rpc('meu_perfil'); meuIdNuvem=data||null;}catch(e){}
    const eu=(meuIdNuvem&&dados.perfis.find(p=>p.id===meuIdNuvem))
      ||dados.perfis.find(p=>p.user_id)||dados.perfis[0];
    DB=normalizar(Object.assign(novo,{sessao:eu?eu.id:null,ultimoAcesso:eu?eu.id:null,
      meuId:eu?eu.id:null,instalarOculto:DB.instalarOculto}));
    SNAP=achatar(DB); ULTIMO_SYNC=new Date().toISOString();
    NUVEM_ESTADO='on'; NUVEM_PASSO=''; MOSTRA_CODIGO=false;
    save(); PILHA.length=0;
    VIEW={n:temPainel(pessoa(DB.sessao))?'escalas':'minha',id:null};
    render(); toast('Conectado à nuvem');
    return true;
  }catch(err){
    NUVEM_ESTADO='erro';
    NUVEM_ERRO=(NUVEM_PASSO?'Falhou ao '+NUVEM_PASSO+': ':'')+(err&&err.message||String(err));
    render();
    return false;
  }
}

/* canal: por onde avisar | aoEscalar: avisar na hora que entra na escala
   dias: [7,3,1] = quantos dias antes repetir | hora: horario do disparo    */
const CANAIS={push:'Notificação no celular',whatsapp:'WhatsApp (um toque)',
  ambos:'Notificação e WhatsApp',nenhum:'Não avisar automaticamente'};
const DIAS_OP=[14,7,5,3,2,1];
function cfgAviso(){
  return Object.assign({canal:'push',aoEscalar:true,dias:[1],hora:'10:00'},
    (DB.config&&DB.config.aviso)||{});
}
/* quantos avisos cada pessoa recebe por escala */
function qtdAvisos(c){c=c||cfgAviso();return (c.aoEscalar?1:0)+(c.dias||[]).length;}
function resumoAviso(c){
  c=c||cfgAviso();
  if(c.canal==='nenhum')return 'Sem aviso automático';
  const n=qtdAvisos(c);
  const partes=[];
  if(c.aoEscalar)partes.push('ao ser escalado');
  (c.dias||[]).slice().sort((a,b)=>b-a).forEach(d=>
    partes.push(d===1?'na véspera':d+' dias antes'));
  const lista=partes.length>1
    ? partes.slice(0,-1).join(', ')+' e '+partes[partes.length-1]
    : (partes[0]||'nunca');
  return n+' aviso(s): '+lista;
}
/* momentos que caem hoje, na ordem em que devem ser enviados */
function avisosDeHoje(){
  const c=cfgAviso(), out=[];
  (c.dias||[]).slice().sort((a,b)=>b-a).forEach(d=>{
    const alvo=new Date(); alvo.setDate(alvo.getDate()+d); const iso_=iso(alvo);
    DB.eventos.filter(e=>e.data===iso_).forEach(ev=>
      out.push({ev,dias:d,chave:'d'+d,rotulo:d===1?'Véspera':d+' dias antes'}));
  });
  return out;
}
function pendentesDeAviso(){
  return avisosDeHoje().reduce((n,m)=>n+DB.escalas.filter(a=>a.eventoId===m.ev.id

/* ============ NOTIFICACOES (PUSH) ============ */
/* Fluxo: pedir permissao -> assinar no navegador -> guardar a assinatura no
   perfil. Quem envia e o servidor (ver push-notificacoes.md). Sem servidor,
   o app ainda mostra notificacao local para voce testar a permissao. */

function suportaPush(){
  return typeof navigator!=='undefined' && 'serviceWorker' in navigator
    && typeof window!=='undefined' && 'PushManager' in window && 'Notification' in window;
}
function ehIOS(){
  return typeof navigator!=='undefined'
    && /iPad|iPhone|iPod/.test(navigator.userAgent||'')
    && !(window.MSStream);
}
function instalado(){
  if(typeof window==='undefined')return false;
  if(navigator.standalone)return true;
  return !!(window.matchMedia&&window.matchMedia('(display-mode: standalone)').matches);
}
const permissao=()=>(typeof Notification!=='undefined'&&Notification.permission)||'default';
const chaveVapid=()=>(DB.config&&DB.config.vapid)||'';

/* Diagnostico: o que impede esta pessoa de receber notificacao neste aparelho */
/* A inscricao de notificacao pertence ao APARELHO, nao ao cadastro.
   Guardar em DB.pessoas era o erro: toda vez que o app abria e baixava a
   nuvem, o cadastro era substituido e a marca se perdia — por isso as
   notificacoes pareciam desligar sozinhas. Agora fica no localStorage,
   fora do que sincroniza. */
const PUSH_KEY='escala.push';
function pushLocal(){
  try{return JSON.parse(localStorage.getItem(PUSH_KEY))||null;}catch(e){return null;}
}
function setPushLocal(v){
  try{v?localStorage.setItem(PUSH_KEY,JSON.stringify(v)):localStorage.removeItem(PUSH_KEY);}catch(e){}
}
/* Confere no navegador se a inscricao ainda existe e reconcilia os tres
   lugares: aparelho, cadastro local e nuvem. Roda ao abrir o app. */
async function sincronizarPush(){
  if(!suportaPush())return;
  try{
    const reg=await navigator.serviceWorker.ready;
    let sub=await reg.pushManager.getSubscription();
    const local=pushLocal();
    /* O iOS descarta a inscricao quando o app e atualizado ou reinstalado,
       mas guarda a PERMISSAO. Nesse caso da para assinar de novo em silencio:
       nenhuma janela aparece, porque permitir ja foi permitido. Sem isto, a
       pessoa tinha de tocar em "Ativar" a cada atualizacao. */
    if(!sub&&permissao()==='granted'&&chaveVapid()){
      try{
        sub=await reg.pushManager.subscribe({userVisibleOnly:true,
          applicationServerKey:b64ToUint8(chaveVapid())});
      }catch(e){sub=null;}
    }
    if(sub){
      const j=sub.toJSON();
      const reg2=Object.assign({},local||{},{endpoint:j.endpoint,keys:j.keys,
        aparelho:(local&&local.aparelho)||nomeAparelho(),
        quando:(local&&local.quando)||new Date().toISOString()});
      setPushLocal(reg2);
      /* o banco pode nao conhecer este aparelho (cadastro recriado, outro
         navegador): registrar de novo e inofensivo, o upsert cuida */
      const eu=souEu();
      if(naNuvem()&&eu){
        const ja=(DB.pushAssinaturas||[]).some(x=>x.endpoint===j.endpoint&&x.perfilId===eu.id);
        if(!ja){try{await registrarAparelhoNaNuvem(sub,reg2.aparelho);}catch(e){}}
      }
      if(eu&&!eu.push){eu.push={endpoint:j.endpoint,quando:reg2.quando,aparelho:reg2.aparelho};}
    }else if(local&&local.endpoint&&permissao()!=='granted'){
      /* so desliga de verdade quando a permissao tambem se foi; se a chave do
         servidor ainda nao chegou, e melhor esperar do que dizer "desativado" */
      setPushLocal(null);
    }
    render();
  }catch(e){}
}
/* Quantas pessoas tem pelo menos um aparelho recebendo. Na nuvem a verdade
   e a tabela push_assinaturas; sem nuvem, o que esta no cadastro local. */
function recebendoPush(){
  if(naNuvem())return new Set((DB.pushAssinaturas||[]).map(x=>x.perfilId)).size;
  return DB.pessoas.filter(x=>x.push&&(x.push.endpoint||x.push.local)).length;
}
/* "local" = a pessoa deu permissao numa epoca em que o servidor ainda nao
   tinha chave. Nao vale como ativo depois que a chave existe: o aparelho
   precisa ser registrado, senao nada e enviado e o app mente dizendo
   "Ativadas". */
function estadoLocal(){
  return chaveVapid()
    ? {ok:false,cod:'incompleto',
       txt:'Permissão concedida, mas este aparelho ainda não foi registrado no servidor.'}
    : {ok:true,cod:'local',
       txt:'Permissão concedida. Falta o servidor para o envio automático.'};
}
function estadoPush(p){
  p=p||souEu();
  const meu=(p&&DB.sessao&&p.id===DB.sessao)?pushLocal():null;
  if(meu&&meu.endpoint)return{ok:true,cod:'ativo',txt:'Notificações ativas neste aparelho'};
  if(meu&&meu.local)return estadoLocal();
  if(p&&p.push&&p.push.endpoint)return{ok:true,cod:'ativo',txt:'Notificações ativas neste aparelho'};
  if(p&&p.push&&p.push.local)return estadoLocal();
  if(!suportaPush())return{ok:false,cod:'sem-suporte',
    txt:'Este navegador não suporta notificações.'};
  if(ehIOS()&&!instalado())return{ok:false,cod:'instalar',
    txt:'No iPhone é preciso instalar o app na tela de início primeiro.'};
  if(permissao()==='denied')return{ok:false,cod:'bloqueado',
    txt:'Notificações bloqueadas nos ajustes do aparelho.'};
  return{ok:false,cod:'desligado',txt:'Notificações desligadas neste aparelho.'};
}

function b64ToUint8(base64){
  const pad='='.repeat((4-base64.length%4)%4);
  const b=(base64+pad).replace(/-/g,'+').replace(/_/g,'/');
  const raw=atob(b), arr=new Uint8Array(raw.length);
  for(let i=0;i<raw.length;i++)arr[i]=raw.charCodeAt(i);
  return arr;
}
function nomeAparelho(){
  const u=(navigator.userAgent||'');
  if(/iPhone/.test(u))return 'iPhone';
  if(/iPad/.test(u))return 'iPad';
  if(/Android/.test(u))return 'Android';
  if(/Mac/.test(u))return 'Mac';
  if(/Windows/.test(u))return 'Windows';
  return 'navegador';
}

/* O servidor precisa conhecer o aparelho para conseguir enviar. */
async function registrarAparelhoNaNuvem(sub,aparelho){
  if(!naNuvem()||!DB.sessao||!sub)return;
  const j=sub.toJSON?sub.toJSON():sub;
  if(!j.endpoint||!j.keys)return;
  const{error}=await SB.from('push_assinaturas').upsert({
    perfil_id:DB.sessao,endpoint:j.endpoint,
    p256dh:j.keys.p256dh,auth:j.keys.auth,aparelho:aparelho||nomeAparelho()
  },{onConflict:'endpoint'});
  if(error)throw new Error('Não consegui registrar este aparelho: '+error.message);
  DB.pushAssinaturas=(DB.pushAssinaturas||[]).filter(x=>x.endpoint!==j.endpoint)
    .concat([{perfilId:DB.sessao,aparelho:aparelho||nomeAparelho(),endpoint:j.endpoint}]);
}
async function removerAparelhoDaNuvem(endpoint){
  if(!naNuvem()||!endpoint)return;
  await SB.from('push_assinaturas').delete().eq('endpoint',endpoint);
  DB.pushAssinaturas=(DB.pushAssinaturas||[]).filter(x=>x.endpoint!==endpoint);
}
async function ativarPush(){
  const p=souEu(); if(!p)return;
  const e=estadoPush(p);
  if(e.cod==='instalar')return ajudaInstalar();
  if(e.cod==='sem-suporte')return toast('Este navegador não suporta notificações');
  if(e.cod==='bloqueado')return ajudaBloqueado();
  try{
    const perm=await Notification.requestPermission();
    if(perm!=='granted'){toast('Permissão negada');render();return;}
    const reg=await navigator.serviceWorker.ready;
    const key=chaveVapid();
    if(key){
      const sub=await reg.pushManager.subscribe({userVisibleOnly:true,
        applicationServerKey:b64ToUint8(key)});
      p.push=Object.assign(JSON.parse(JSON.stringify(sub.toJSON())),
        {quando:new Date().toISOString(),aparelho:nomeAparelho()});
      setPushLocal(p.push);          /* copia que sobrevive ao sync */
      await registrarAparelhoNaNuvem(sub);
      toast('Notificações ativadas');
    }else{
      /* sem chave do servidor ainda: guarda so a permissao */
      p.push={local:true,quando:new Date().toISOString(),aparelho:nomeAparelho()};
      setPushLocal(p.push);
      toast('Permissão concedida neste aparelho');
    }
    save();render();
    await notificarLocal('Notificações ativadas','Você será avisado quando for escalado.');
  }catch(err){
    toast('Não consegui ativar: '+(err&&err.message||'erro'));
  }
}
async function desativarPush(){
  const p=souEu(); if(!p)return;
  if(!confirm('Parar de receber notificações neste aparelho?'))return;
  try{
    const reg=await navigator.serviceWorker.ready;
    const sub=await reg.pushManager.getSubscription();
    if(sub){await removerAparelhoDaNuvem(sub.endpoint);await sub.unsubscribe();}
    else{const l=pushLocal();
      if(l&&l.endpoint)await removerAparelhoDaNuvem(l.endpoint);
      else if(p.push&&p.push.endpoint)await removerAparelhoDaNuvem(p.push.endpoint);}
  }catch(e){}
  p.push=null;setPushLocal(null);save();render();toast('Notificações desativadas');
}
async function notificarLocal(titulo,corpo){
  try{
    if(permissao()!=='granted')return false;
    const reg=await navigator.serviceWorker.ready;
    await reg.showNotification(titulo,{body:corpo,icon:'icon-192.png',badge:'icon-192.png',
      tag:'escala',data:{url:location.pathname}});

}

/* ============ LEMBRAR DE ATIVAR AS NOTIFICAÇÕES ============ */
/* Quem não recebe aviso descobre a troca de escala tarde demais. Vale
   lembrar — mas lembrete que aparece toda vez vira barulho, e barulho a
   pessoa aprende a fechar sem ler.

   As regras que tornam isto aceitável:
     · espaçamento que cresce: 7 dias nas três primeiras vezes, 30 depois
     · uma saída definitiva, que é respeitada para sempre
     · nada para quem já ativou, para quem o navegador não suporta, e para
       quem ainda não pertence a nenhuma equipe (não vai ser escalado)
     · no máximo uma interrupção por abertura do app — o convite da agenda
       e este lembrete nunca se atropelam
   O texto diz POR QUE, não só "ative": é uma escala de igreja, a pessoa
   merece o motivo. */
const PUSH_LEMBRETE='escala.push.lembrete';
var JA_INTERROMPI=false;   /* só uma folha por abertura do app */

function lembreteLido(){
  try{return JSON.parse(localStorage.getItem(PUSH_LEMBRETE)||'null')||{};}
  catch(e){return {};}
}
function lembreteGrava(v){
  try{localStorage.setItem(PUSH_LEMBRETE,JSON.stringify(v));}catch(e){}
}
const DIA=86400000;

/* devolve o motivo de NÃO mostrar, ou '' quando é hora de lembrar.
   Separado da tela para poder ser conferido nos testes. */
function devoLembrarPush(){
  const p=souEu();
  if(!p)return 'sem cadastro';
  if(JA_INTERROMPI)return 'já interrompi nesta abertura';
  const e=estadoPush(p);
  if(e.ok)return 'já recebe';
  if(e.cod==='sem-suporte')return 'navegador não suporta';
  if(!p.teamIds||!p.teamIds.length)return 'ainda não está em nenhuma equipe';
  /* Sem intervalo e sem "não me lembre": enquanto a pessoa não estiver
     recebendo, o aviso aparece em toda abertura do app. É a decisão da
     liderança — quem não recebe notificação descobre a escala tarde, e o
     custo disso cai sobre o time inteiro. Uma folha por abertura (JA_INTERROMPI)
     continua valendo, para não empilhar com o convite da agenda. */
  return '';
}

function lembrarPush(){
  if(devoLembrarPush())return false;
  const e=estadoPush(souEu());
  const m=lembreteLido();
  lembreteGrava({quando:new Date().toISOString(),vezes:(m.vezes||0)+1});
  JA_INTERROMPI=true;

  /* três situações diferentes, três saídas diferentes. Mandar "ative as
     notificações" para quem bloqueou nos ajustes do aparelho é pedir uma
     coisa que o botão do app não consegue fazer. */
  const caso=e.cod==='instalar'
    ?{titulo:'Instale o app para receber avisos',
      texto:'No iPhone, o aviso só chega com o app instalado na tela de início. '
        +'São dois toques, e depois ele abre como qualquer outro aplicativo.',
      botao:'Ver como instalar', acao:'ajudaInstalar()'}
    :e.cod==='bloqueado'
    ?{titulo:'As notificações estão bloqueadas',
      texto:'Em algum momento o aviso foi recusado neste aparelho, e só os ajustes '
        +'do celular podem liberar de novo. É rápido.',
      botao:'Ver onde liberar', acao:'ajudaBloqueado()'}
    :{titulo:'Você pode estar perdendo avisos',
      texto:'É por notificação que você fica sabendo que entrou numa escala, que '
        +'alguém pediu troca com você, ou que o horário mudou. Sem ela, só '
        +'abrindo o app para descobrir.',
      botao:'Ativar notificações', acao:'ativarPush()'};

  const h='<p style="margin:0 0 14px;line-height:1.6">'+caso.texto+'</p>'
   +'<div class="card" style="margin:0 0 16px">'
   +linhaAg('sino','Entrou numa escala','No mesmo dia em que o líder monta.')
   +linhaAg('troca','Pediram troca com você','Dá para responder antes de virar problema.')
   +linhaAg('relogio','Mudou o horário','O aviso chega mesmo com o app fechado.')
   +'</div>'

/* ============ AGENDA DO CELULAR ============ */
/* A escala entra no Google Agenda e no Calendário do iPhone por ASSINATURA:
   a pessoa cola um endereço uma vez e o aparelho reconfere sozinho.

   Foi de propósito que nao usamos o login do Google. Assinatura nao pede
   senha, nao guarda acesso à agenda pessoal de ninguém, e funciona igual no
   iPhone — onde o login do Google nao resolveria. O preço é que a atualização
   nao é instantânea, o que para uma escala feita com semanas de antecedência
   nao faz diferença.

   O endereço carrega uma chave secreta. Quem tiver o link lê a escala daquela
   pessoa, e nada mais: nao dá para escrever, nem para ver os outros. */
const AGENDA_KEY='escala.agenda';
const AGENDA_CONVITE='escala.agenda.convite';
var AGENDA_TOKEN=null;   /* chave desta pessoa, quando já pedida */
var AGENDA_TEM=null;     /* true | false | null (ainda nao perguntei) */

function agendaLocal(){try{return localStorage.getItem(AGENDA_KEY)||null;}catch(e){return null;}}
function setAgendaLocal(t){
  try{t?localStorage.setItem(AGENDA_KEY,t):localStorage.removeItem(AGENDA_KEY);}catch(e){}
}
function agendaLigada(){return !!(AGENDA_TOKEN||agendaLocal())||AGENDA_TEM===true;}
function agendaUrl(t){return NUVEM_URL+'/functions/v1/agenda?t='+encodeURIComponent(t);}
/* webcal:// é o que faz o iPhone abrir a caixa de "assinar calendário"
   direto, sem passar por Ajustes */
function agendaWebcal(t){return agendaUrl(t).replace(/^https?:/,'webcal:');}
const ehApple=()=>/iPhone|iPad|iPod|Macintosh/i.test(navigator.userAgent||'');
/* O Google aceita o endereco do calendario como parametro cid: abre a tela
   dele ja perguntando "adicionar este calendario?". E um toque e confirmar,
   em vez de copiar o endereco e procurar o menu "De URL". */
function linkGoogleAssinatura(t){
  return 'https://calendar.google.com/calendar/u/0/r?cid='+encodeURIComponent(agendaUrl(t));
}

/* Roda depois de conectar. Se a migração ainda nao foi aplicada, a chamada
   devolve erro e o app simplesmente nao oferece o recurso — ninguém vê nada
   quebrado. */
async function verificarAgenda(){
  if(!naNuvem()||!souEu())return;
  const t=agendaLocal();
  if(t){AGENDA_TOKEN=t;AGENDA_TEM=true;render();return;}
  try{
    const{data,error}=await SB.rpc('tenho_agenda');
    if(error)return;
    AGENDA_TEM=data===true;
  }catch(e){return;}
  /* so para quem ainda nao ligou, e respeitando o "agora nao" por duas semanas */
  if(!AGENDA_TEM&&devoConvidarAgenda()&&!JA_INTERROMPI){JA_INTERROMPI=true;convidarAgenda();}
  render();
}

/* "Agora nao" nao e "nunca mais": o convite volta daqui a duas semanas, ate
   tres vezes. Sumir para sempre e como a agenda ficou com zero assinaturas
   enquanto estava pronta para usar. */
const AGENDA_ESPERA=14*86400000;
function conviteAgendaLido(){
  try{return JSON.parse(localStorage.getItem(AGENDA_CONVITE)||'{}')||{};}catch(e){return {};}
}
function conviteAgendaGrava(v){
  try{localStorage.setItem(AGENDA_CONVITE,JSON.stringify(v));}catch(e){}
}
function devoConvidarAgenda(){
  const m=conviteAgendaLido();
  if(m.estado==='ativou')return false;
  if((m.vezes||0)>=3)return false;
  if(m.quando&&Date.now()-new Date(m.quando).getTime()<AGENDA_ESPERA)return false;
  return true;
}

  const m=conviteAgendaLido();

/* ============ UM CULTO NA AGENDA, AGORA ============ */
/* A assinatura acima é o caminho completo: atualiza sozinha, mas é um
   calendário separado e só de leitura, e no Google demora para chegar.

   Isto aqui é o caminho curto: cria um evento DE VERDADE dentro do
   calendário da pessoa, que ela pode arrastar e editar, sem configurar nada
   e sem esperar. O preço é ser uma cópia: se a escala mudar, este evento
   não muda junto — por isso o app avisa isso na tela, e continua mandando
   notificação quando algo muda.

   Tudo é montado aqui no aparelho, sem servidor: funciona offline e não
   depende de a Edge Function estar publicada. */

/* O instante certo, sem depender do fuso do aparelho.
   Perguntamos ao navegador que horas o nosso palpite marca em São Paulo e
   corrigimos pela diferença. Duas passadas resolvem inclusive o caso de o
   ajuste cair em cima de uma mudança de fuso — que hoje não existe no
   Brasil, mas já existiu e pode voltar. */
function instanteBR(data,hora){
  const[a,m,d]=String(data).split('-').map(Number);
  const[H,M]=String(hora||'19:00').split(':').map(Number);
  const alvo=Date.UTC(a,m-1,d,H,M);
  let ts=alvo;
  for(let i=0;i<2;i++){
    let g={};
    try{
      new Intl.DateTimeFormat('en-US',{timeZone:'America/Sao_Paulo',year:'numeric',
        month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false})
        .formatToParts(new Date(ts)).forEach(p=>{g[p.type]=p.value;});
    }catch(e){return new Date(alvo+3*3600000);}  /* sem Intl: Brasília é UTC-3 */
    const visto=Date.UTC(+g.year,+g.month-1,+g.day,(+g.hour)%24,+g.minute);
    ts+=alvo-visto;
  }
  return new Date(ts);
}
const zulu=d=>d.toISOString().replace(/[-:]/g,'').replace(/\.\d{3}/,'');
const icsTxt=s=>String(s==null?'':s).replace(/\\/g,'\\\\').replace(/;/g,'\\;')
  .replace(/,/g,'\\,').replace(/\r?\n/g,'\\n');
/* linha do formato tem limite de 75 octetos, e acento ocupa dois */
function icsDobra(l){
  const b=new TextEncoder().encode(l);
  if(b.length<=75)return l;
  const partes=[]; let i=0,lim=75;
  while(i<b.length){
    let f=Math.min(i+lim,b.length);
    while(f>i&&f<b.length&&(b[f]&0xc0)===0x80)f--;
    partes.push(new TextDecoder().decode(b.slice(i,f)));
    i=f; lim=74;
  }
  return partes.join('\r\n ');
}

/* os dados de uma escala, prontos para virar evento em qualquer formato */
function dadosDoCompromisso(escalaId){
  const a=DB.escalas.find(x=>x.id===escalaId); if(!a)return null;
  const ev=evento(a.eventoId); if(!ev)return null;
  const t=team(a.teamId), f=funcao(a.teamId,a.funcaoId);
  const ch=chegada(ev,a.teamId);
  return {
    id:a.id, titulo:(f?f.nome:'Escala')+' · '+ev.titulo,
    inicio:instanteBR(ev.data,ch),
    fim:new Date(instanteBR(ev.data,ev.hora).getTime()+2*3600000),
    local:(DB.config&&DB.config.igreja)||'Igreja',
    detalhe:'Equipe: '+(t?t.nome:'-')+'\nFunção: '+(f?f.nome:'-')
      +'\nChegada às '+ch+', culto às '+ev.hora+'.'
      +'\n\nConfirmar ou pedir troca: https://tecnica.escalaiir.com'
  };
}

function icsDeUmaEscala(escalaId){
  const c=dadosDoCompromisso(escalaId); if(!c)return null;
  const L=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Escala da Equipe//PT-BR//',
    'CALSCALE:GREGORIAN','METHOD:PUBLISH','BEGIN:VEVENT',
    'UID:'+c.id+'@escalaiir.com',
    'DTSTAMP:'+zulu(new Date()),
    'DTSTART:'+zulu(c.inicio),
    'DTEND:'+zulu(c.fim),
    'SUMMARY:'+icsTxt(c.titulo),
    'DESCRIPTION:'+icsTxt(c.detalhe),
    'LOCATION:'+icsTxt(c.local),
    'BEGIN:VALARM','ACTION:DISPLAY','TRIGGER:-P1D',
    'DESCRIPTION:'+icsTxt('Amanhã: '+c.titulo),'END:VALARM',
    'END:VEVENT','END:VCALENDAR'];
  return L.map(icsDobra).join('\r\n')+'\r\n';
}

function linkGoogleAgenda(escalaId){
  const c=dadosDoCompromisso(escalaId); if(!c)return '';
  const q={action:'TEMPLATE',text:c.titulo,
    dates:zulu(c.inicio)+'/'+zulu(c.fim),
    details:c.detalhe,location:c.local};
  return 'https://calendar.google.com/calendar/render?'
    +Object.keys(q).map(k=>k+'='+encodeURIComponent(q[k])).join('&');
}

function baixarIcs(escalaId){
  const texto=icsDeUmaEscala(escalaId);
  if(!texto)return toast('Não achei esta escala');
  try{
    const b=new Blob([texto],{type:'text/calendar;charset=utf-8'});
    const u=URL.createObjectURL(b);
    const a=document.createElement('a');
    a.href=u; a.download='escala.ics';
    document.body.appendChild(a); a.click();
    setTimeout(()=>{try{document.body.removeChild(a);URL.revokeObjectURL(u);}catch(e){}},1500);
    closeSheet();
    toast('Abra o arquivo baixado para adicionar');
  }catch(e){
    toast('Este navegador não deixou baixar');
  }
}

/* ---- abrir o WhatsApp -------------------------------------------------

   janela do app para o web.whatsapp.com sem botao de voltar. */
function urlWhats(num,txt){
  const t=encodeURIComponent(txt||'');
  return (ehIOS()&&instalado())
    ? 'whatsapp://send?phone='+num+'&text='+t
    : 'https://wa.me/'+num+'?text='+t;
}
function abrirWhatsUrl(num,txt){
  const url=urlWhats(num,txt);
  if(ehIOS()&&instalado()){window.location.href=url;return;}
  const w=window.open(url,'_blank','noopener');
  if(!w)window.location.href=url;      /* bloqueador de pop-up: vai na mesma aba */
}

/* (11) 91234-5678 -> 5511912345678 ; aceita numero ja com DDI */
function telE164(tel){
  let d=String(tel||'').replace(/\D/g,'');
  if(!d)return '';
  if(d.startsWith('00'))d=d.slice(2);
  if(d.length<=9)return '';                 // sem DDD, nao da para montar o link
  if(!d.startsWith('55')||d.length<=11)d='55'+d;
  return d;
}
const temTelefone=p=>!!telE164(p&&p.telefone);
function preencher(tpl,c){
  return String(tpl).replace(/\{(\w+)\}/g,(m,k)=>c[k]!==undefined?c[k]:m);
}
function ctxEscala(a){
  const ev=evento(a.eventoId), p=pessoa(a.pessoaId),
        f=funcao(a.teamId,a.funcaoId), t=team(a.teamId);
  return{nome:p.nome,primeiro:p.nome.split(' ')[0],evento:ev.titulo,
    data:fmt(ev.data),dataLonga:fmtLong(ev.data),hora:ev.hora,
    chegada:chegada(ev,a.teamId),funcao:f?f.nome:'',equipe:t?t.nome:'',
    quando:'em breve',link:location.origin+location.pathname};
}
/* tipo: 'convocacao' | 'lembrete' | 'd1','d3','d7'... (momento configurado) */
function quandoTexto(tipo,ev){
  if(tipo==='convocacao')return 'no dia '+fmt(ev.data);
  const m=/^d(\d+)$/.exec(tipo||'');
  const d=m?+m[1]:1;
  return d===1?'amanhã':d===0?'hoje':'em '+d+' dias';
}
function abrirWhats(a,tipo){
  const p=pessoa(a.pessoaId), num=telE164(p.telefone);
  if(!num){toast(p.nome+' está sem telefone');return;}
  const ctx=ctxEscala(a); ctx.quando=quandoTexto(tipo,evento(a.eventoId));
  const txt=preencher(tipo==='convocacao'?tplConv():tplLemb(),ctx);
  a.avisos=a.avisos||{}; a.avisos[tipo]=new Date().toISOString(); save();
  abrirWhatsUrl(num,txt);
  setTimeout(render,400);
}
const jaAvisado=(a,tipo)=>!!(a.avisos&&a.avisos[tipo]);
function aAvisarHoje(){
  const dias=(DB.config&&DB.config.diasLembrete)||1;
  const lim=new Date(); lim.setDate(lim.getDate()+dias); const limIso=iso(lim);
  return DB.escalas.filter(a=>{const e=evento(a.eventoId);
    return e&&e.data>=hojeIso()&&e.data<=limIso&&!jaAvisado(a,'lembrete')&&temTelefone(pessoa(a.pessoaId));}).length;
}

/* lista de envio para um evento */
function avisarEvento(evId,tipo){
  const ev=evento(evId);
  const lista=DB.escalas.filter(a=>a.eventoId===evId)
    .sort((a,b)=>{const x=team(a.teamId),y=team(b.teamId);
      return (x?x.nome:'').localeCompare(y?y.nome:'')||0;});
  let h='<p class="sub" style="margin:0 0 12px;padding:0">'+esc(ev.titulo)+' &middot; '+fmtLong(ev.data)
   +'<br>Toque em cada pessoa para abrir o WhatsApp com a mensagem pronta.</p>';
  const semTel=lista.filter(a=>!temTelefone(pessoa(a.pessoaId))).length;
  if(semTel)h+='<div class="warnbox" style="margin:0 0 12px">'+semTel+' pessoa(s) sem telefone cadastrado.</div>';
  h+='<div class="card" style="margin:0">';
  if(!lista.length)h+='<div class="empty">Ninguém escalado ainda.</div>';
  lista.forEach(a=>{const p=pessoa(a.pessoaId), f=funcao(a.teamId,a.funcaoId), ok=jaAvisado(a,tipo);
    const tel=temTelefone(p);
    h+='<div class="row"'+(tel?' onclick="abrirWhats(escalaPorId(\''+a.id+'\'),\''+tipo+'\')"':' style="cursor:default;opacity:.5"')+'>'
     +'<div class="avatar">'+esc(ini(p.nome))+'</div>'
     +'<div class="grow"><div class="t">'+esc(p.nome)+'</div>'
     +'<div class="s">'+esc(f?f.nome:'')+(tel?'':' &middot; sem telefone')+'</div></div>'
     +(tel?'<span class="pill '+(ok?'ok':'')+'">'+(ok?'enviado':'enviar')+'</span>':'')+'</div>';});
  h+='</div><div class="gap"></div>'
   +'<button class="btn2" onclick="compartilhar(\''+evId+'\')">Mandar a escala inteira no grupo</button>';
  openSheet(tipo==='lembrete'?'Lembrete de amanhã':'Avisar quem foi escalado',h,null);
}

/* desliga a nuvem NESTE aparelho e volta para o modo local */
/* Volta para a tela de código, custe o que custar. E a saida de emergencia de
   quem se perdeu: desligou a nuvem sem querer, entrou como outra pessoa, ou
   criou uma igreja local por engano. Um toque e a pessoa esta de novo na
   estaca zero, com o campo do codigo na frente. */
function voltarParaCodigo(){
  if(!confirm('Entrar com um código de convite? Isso limpa o que está neste '
    +'aparelho. Os dados da equipe, na nuvem, não são afetados.'))return;
  try{localStorage.removeItem(NUVEM_KEY);}catch(e){}   /* desfaz o "só local" */
  DB=vazio(); MOSTRA_CODIGO=true; save();
  closeSheet(); PILHA.length=0; SNAP=null; SB=null;
  if(nuvemCfg()){
    NUVEM_ESTADO='ligando'; render();
    nuvemConectar(null).catch(()=>{NUVEM_ESTADO='erro';render();});
  }else{ NUVEM_ESTADO='off'; render(); }
}
function usarSoLocal(){
  if(!confirm('Desligar a nuvem neste aparelho e criar uma igreja local? '
    +'Os dados da nuvem continuam intactos.'))return;
  nuvemDesligar(); DB=vazio(); MOSTRA_CODIGO=false; save();
  closeSheet(); PILHA.length=0; VIEW={n:'escalas',id:null}; render();
  toast('Modo local. Crie a sua igreja.');
}
function comecarComoLider(){
  if(!confirm('Apagar tudo o que está neste aparelho e criar o seu cadastro de líder?'))return;
  DB=vazio();save();closeSheet();PILHA.length=0;VIEW={n:'escalas',id:null};render();
}
function criarLider(){
  const ig=(document.getElementById('sIgreja')||{value:''}).value.trim();
  const n=(document.getElementById('sNome').value||'').trim();
  const e=(document.getElementById('sMail').value||'').trim();
  const b=document.getElementById('sNasc').value;
  if(!ig)return toast('Digite o nome da igreja');
  if(!n)return toast('Digite o seu nome');
  if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(e))return toast('E-mail invalido');
  const p={id:uid(),nome:n,telefone:'',email:e,nascimento:b,codigo:novoCodigo(),
    perms:{admin:true},lider:true,teamIds:[],funcaoIds:[]};
  DB.config.igreja=ig;
  DB.pessoas.push(p);abrirSessao(p);
  VIEW={n:'equipes',id:null};render();toast('Tudo pronto. Comece criando as equipes.');
}
function entrar(){
  const c=(document.getElementById('loginCod').value||'').trim().toUpperCase();
  if(!c)return;
  if(nuvemCfg()&&!naNuvem()){          /* nuvem ligada: o código vale lá */
    toast('Entrando…'); nuvemConectar(c); return;
  }
  const p=DB.pessoas.find(x=>(x.codigo||'')===c);
  if(!p){document.getElementById('loginErr').style.display='block';return;}
  abrirSessao(p);
  toast('Olá, '+p.nome.split(' ')[0]+'!');
}
/* Sair mantem o aparelho vinculado: volta com um toque, sem digitar codigo. */
function sair(){
  if(!confirm('Sair? Você volta com um toque, sem precisar do código.'))return;
  DB.sessao=null;MOSTRA_CODIGO=false;save();
  PILHA.length=0;VIEW={n:'escalas',id:null};render();
}
/* Desvincular = tirar o atalho deste aparelho (celular emprestado, revenda...) */
function desvincular(){
  if(!confirm('Desvincular este aparelho? Na próxima vez será preciso digitar o código de novo.'))return;
  DB.sessao=null;DB.ultimoAcesso=null;MOSTRA_CODIGO=true;save();
  PILHA.length=0;VIEW={n:'escalas',id:null};render();

/* Aceitar troca mexe em duas tabelas. Fazer isso local e sincronizar depois
   permitia o pior dos mundos: a vaga trocar e o pedido continuar aberto.
   Com a nuvem ligada, quem decide é o servidor, numa transação só. */
async function aceitarTrocaNaNuvem(tid){
  if(!naNuvem())return null;
  try{
    const{data,error}=await SB.rpc('aceitar_troca_completa',{p_troca:tid});
    if(error)return {erro:error.message};
    return data||{ok:false,motivo:'sem resposta'};
  }catch(e){return {erro:e.message||String(e)};}
}
/* ---- troca casada na hora de assumir ----------------------------------
   Quem se oferece para cobrir quase sempre tambem esta escalado noutro dia.
   Antes era preciso assumir primeiro e abrir outro pedido depois, torcendo
   para alguem pegar. Agora, no momento de assumir, o app mostra as SUAS
   datas que a pessoa do pedido poderia cobrir: um rende o outro.
   Ela confirma — ninguem e escalado sem aceitar —, e se nao houver
   casamento possivel a tela nem aparece: assume e pronto. */
function permutasAoAssumir(tid,pid){
  const t=DB.trocas.find(x=>x.id===tid);
  if(!t||t.status!=='aberta'||t.permutaDe)return [];
  if(t.deId===pid)return [];
  return minhasEscalas(pid).filter(x=>
    x.a.id!==t.escalaId&&!trocaDaEscala(x.a.id)&&podeAssumir({escalaId:x.a.id},t.deId));
}
function aceitarTrocaUI(tid){
  const t=DB.trocas.find(x=>x.id===tid); if(!t)return;
  const opcoes=permutasAoAssumir(tid,DB.sessao);
  if(!opcoes.length)return confirmarAssumir(tid);
  const de=pessoa(t.deId), primeiro=de.nome.split(' ')[0];
  let h='<p class="sub" style="margin:0 0 14px;padding:0">Você vai assumir o '
   +esc(descTroca(t))+' de '+esc(de.nome)+'.</p>'
   +'<div class="sec-t" style="margin:0 0 4px">Trocar de data, em vez de só pegar a dela</div>'
   +'<p class="sub" style="margin:0 0 10px;padding:0;font-size:13px">Escolha uma das suas datas '
   +'abaixo e '+esc(primeiro)+' assume ela no seu lugar. Uma rende a outra. '
   +esc(primeiro)+' precisa confirmar; até lá nada muda.</p>'
   +'<div class="card" style="margin:0 0 16px">';
  opcoes.forEach(x=>{
    const f=funcao(x.a.teamId,x.a.funcaoId);
    h+='<div class="row" onclick="permutarAoAssumir(\''+tid+'\',\''+x.a.id+'\')">'
     +'<div class="avatar" style="background:var(--ok-soft);color:var(--ok)">'+ico('troca',18)+'</div>'
     +'<div class="grow"><div class="t">Você passa '+esc(f?f.nome:'')+' &middot; '+fmt(x.e.data)+'</div>'
     +'<div class="s">'+esc(x.e.titulo)+' &middot; '+esc(primeiro)+' assume no seu lugar</div></div>'
     +'<span class="chev">&#8250;</span></div>';});
  h+='</div><button onclick="closeSheet();confirmarAssumir(\''+tid+'\')">'
   +'Só assumir a vaga de '+esc(primeiro)+'</button>'
   +'<p class="sub" style="font-size:13px;margin-top:10px;padding:0">Assim você fica com as duas '
   +'datas: a sua e a dela.</p>';
  openSheet('Assumir a vaga',h,null);
}
function permutarAoAssumir(tid,escalaId){
  closeSheet();
  if(pedirPermuta(escalaId,tid,'')===false)return;
  render();
}
async function confirmarAssumir(tid){
  const t=DB.trocas.find(x=>x.id===tid); if(!t)return;
  const a=escalaPorId(t.escalaId), ev=evento(a.eventoId), f=funcao(a.teamId,a.funcaoId);
  const base='Assumir '+f.nome+' em '+ev.titulo+' ('+fmtLong(ev.data)
    +', chegar '+chegada(ev,a.teamId)+')';
  /* numa permuta a pessoa precisa saber que sai de uma data e entra na outra */
  const outra=t.permutaDe?DB.trocas.find(x=>x.id===t.permutaDe):null;
  const txt=outra
    ? base+'?\n\nEm troca, '+pessoa(t.deId).nome+' assume o seu '+descTroca(outra)+'.'
    : base+'?';
  if(!confirm(txt))return;
  const r=await aceitarTrocaNaNuvem(tid);
  if(r&&r.erro){toast('Não consegui confirmar: '+r.erro);return;}
  if(r&&r.ok===false){
    /* alguém foi mais rápido, ou a permuta caiu. Buscar de novo evita
       mostrar uma realidade que não existe mais no servidor. */
    toast(r.motivo||'Este pedido não está mais disponível');
    try{DB=montar(await nuvemBaixar());SNAP=achatar(DB);save();}catch(e){}
    render(); return;
  }
  /* o servidor já resolveu: refletir aqui e registrar os avisos */
  aceitarTroca(tid,DB.sessao,!!r);
  render();
}

/* ---- validade do codigo de acesso -------------------------------------
   O codigo e a senha da pessoa, e ate agora era eterno: quem tivesse o
   codigo de um administrador virava administrador, para sempre. Agora ele
   vence, da para gerar outro (o anterior morre na hora) e da para
   desconectar aparelhos — util quando alguem troca ou perde o celular. */
function validadeCodigo(p){
  if(!p||!p.codigoExpira)return{cls:'mut',txt:'sem validade',quando:''};
  const alvo=new Date(p.codigoExpira), falta=alvo.getTime()-Date.now();
  const quando=String(alvo.getDate()).padStart(2,'0')+'/'+String(alvo.getMonth()+1).padStart(2,'0');
  if(falta<=0)return{cls:'bad',txt:'vencido em '+quando,quando};
  const dias=Math.ceil(falta/DIA);
  if(dias<=3)return{cls:'warn',txt:'vence em '+dias+' dia'+(dias>1?'s':''),quando};
  return{cls:'ok',txt:'vale até '+quando,quando};
}

async function gerarNovoCodigo(pid){
  const p=pessoa(pid); if(!p)return;
  if(!podeMexerNoAcesso(pid))return toast('Você não tem permissão para isso');
  if(!confirm('Gerar um código novo para '+p.nome+'? O código atual para de funcionar.'))return;
  if(!naNuvem()){
    const usados=new Set(DB.pessoas.map(x=>x.codigo));
    let c; do{c=novoCodigo();}while(usados.has(c));
    p.codigo=c; p.codigoUsos=0; save(); closeSheet(); render();
    return toast('Novo código: '+c);
  }
  try{
    /* sem prazo: a protecao aqui e poder trocar o codigo e derrubar
       aparelhos, nao fazer a equipe correr atras de codigo vencido */
    const{data,error}=await SB.rpc('novo_codigo',{p_perfil:pid,p_dias:null});
    if(error)throw new Error(error.message);
    await recarregarDoServidor();
    closeSheet(); render();
    toast('Novo código: '+(data||'gerado'));
  }catch(e){toast('Não consegui gerar: '+(e.message||e));}
}
async function revogarAcessos(pid){
  const p=pessoa(pid); if(!p)return;
  if(!podeMexerNoAcesso(pid))return toast('Você não tem permissão para isso');
  const souEuMesmo=pid===DB.sessao;
  if(!confirm(souEuMesmo
    ?'Desconectar todos os aparelhos, inclusive este? Você vai precisar do código para voltar.'
    :'Desconectar os aparelhos de '+p.nome+'? Ela precisará do código para entrar de novo.'))return;
  if(!naNuvem())return toast('Isso só funciona com a nuvem ligada');
  try{
    const{data,error}=await SB.rpc('revogar_acessos',{p_perfil:pid});
    if(error)throw new Error(error.message);
    closeSheet();
    if(souEuMesmo){DB.sessao=null;MOSTRA_CODIGO=true;save();PILHA.length=0;render();}
    else{await recarregarDoServidor();render();}
    toast((data||0)+' aparelho(s) desconectado(s)');
  }catch(e){toast('Não consegui: '+(e.message||e));}
}

/* ---- tela em branco ao voltar ----------------------------------------
   O iOS descarta a pagina do app quando ela passa muito tempo em segundo
   plano (ou quando outro aplicativo assume a tela) e, ao voltar, as vezes
   devolve a janela viva mas sem nada desenhado. Em vez de deixar a pessoa
   diante de um branco, conferimos: se nao ha conteudo, redesenhamos; se nem
   assim vier, recarregamos. */
function telaVazia(){
  const a=document.getElementById('app');
  return !a||!a.innerHTML||a.innerHTML.trim().length<20;
}
function conferirTela(){
  try{
    if(!telaVazia())return;
    render();
    if(telaVazia())location.reload();
  }catch(e){location.reload();}
}
document.addEventListener('visibilitychange',()=>{
  if(!document.hidden)setTimeout(conferirTela,80);
});
window.addEventListener('pageshow',()=>setTimeout(conferirTela,80));

/* Enquanto voce esta com o app aberto, outra pessoa pode mexer na escala.
   Ao voltar para o app — e de dois em dois minutos com ele na frente — o app
   busca o que mudou. Nunca quando ha algo seu esperando para subir ou uma
   folha aberta: puxar o tapete no meio de uma edicao seria pior do que a
   tela desatualizada. */
var ULTIMA_ATUALIZACAO=0;
async function atualizarDoServidor(forcar){
  try{
    if(typeof naNuvem!=='function'||!naNuvem()||!ONLINE||SALVANDO)return false;
    if(document.hidden)return false;
    if(pendentes())return false;
    const folha=document.getElementById('sheet');
    if(folha&&folha.classList.contains('on'))return false;
    const agora=Date.now();
    if(!forcar&&agora-ULTIMA_ATUALIZACAO<60000)return false;
    ULTIMA_ATUALIZACAO=agora;
    const mudou=await recarregarDoServidor();
    if(mudou){
      const y=window.scrollY||0;
      render();
      window.scrollTo(0,y);          /* a tela mudou, o lugar da leitura nao */
    }
    return mudou;
  }catch(e){return false;}
}
document.addEventListener('visibilitychange',()=>{
  if(!document.hidden)atualizarDoServidor(true);
});
window.addEventListener('focus',()=>atualizarDoServidor(false));
setInterval(()=>atualizarDoServidor(false),120000);

/* Conexao: o navegador avisa quando cai e quando volta */
window.addEventListener('online',voltouOnline);
window.addEventListener('offline',caiuOffline);

/* Android/desktop avisam que da para instalar; viramos isso num botao */
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();PROMPT_INSTALL=e;render();});
window.addEventListener('appinstalled',()=>{PROMPT_INSTALL=null;DB.instalarOculto=true;save();render();});

render();
if('serviceWorker' in navigator){
  navigator.serviceWorker.register('sw.js').catch(()=>{});
  /* assinatura renovada pelo navegador: guarda a nova no perfil */
  navigator.serviceWorker.addEventListener('message',ev=>{
    const d=ev.data||{};
    if(d.tipo==='nova-versao'){
      /* o service worker achou uma versao diferente enquanto servia a do
         cache; quem decide a hora de recarregar e a pessoa */
      try{toast('Versão nova disponível — recarregue para atualizar');}catch(e){}
      return;
    }
    if(d.tipo==='push-renovado'&&d.assinatura){
      const p=souEu(); if(!p)return;
      p.push=Object.assign(JSON.parse(JSON.stringify(d.assinatura)),
        {quando:new Date().toISOString(),aparelho:nomeAparelho()});
      setPushLocal(p.push);
      save(); registrarAparelhoNaNuvem(d.assinatura).catch(()=>{});
    }
  });
}
</script>
